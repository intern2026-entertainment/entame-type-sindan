  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 14px 28px; border: 2px solid var(--line);
  background: var(--accent); color: var(--on-accent);
  font-weight: 900; font-size: 17px; letter-spacing: .02em; text-decoration: none; cursor: pointer;
  box-shadow: 4px 4px 0 var(--line);
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn::after { content: "→"; font-weight: 900; }
.btn.no-arrow::after { content: none; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--line); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.btn.block { display: flex; width: 100%; }
.btn.ghost { background: var(--bg); color: var(--text); }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: 14px; box-shadow: 3px 3px 0 var(--line); }
.btn:focus-visible, .choice:focus-visible, .type-tile:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 3px; }

/* ---- Common sections ---- */
.sec { padding: 64px 0; border-bottom: 2px solid var(--line); }
.sec.alt { background: var(--bg-2); }
.kicker { display: block; font-size: 13px; font-weight: 900; letter-spacing: .2em; color: var(--accent); margin-bottom: 6px; }
.sec-h { font-size: clamp(26px, 6.4vw, 40px); font-weight: 900; line-height: 1.3; margin: 0 0 20px; letter-spacing: .01em; }

/* ---- Hero ---- */
.hero { position: relative; overflow: hidden; border-bottom: 2px solid var(--line); background: var(--bg); }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.hero-bg i { position: absolute; display: block; }
.hero .inner { position: relative; padding-top: 40px; padding-bottom: 48px; display: grid; gap: 28px; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; justify-self: start; background: var(--text); color: var(--bg); font-weight: 900; font-size: 14px; padding: 6px 14px; letter-spacing: .04em; }
.hero-badge b { color: var(--brand-2); }
.hero h1 { font-size: clamp(36px, 10.5vw, 72px); line-height: 1.18; margin: 0; font-weight: 900; letter-spacing: -.01em; }
.hero h1 .mark { background: linear-gradient(transparent 62%, var(--brand-2) 62%); padding: 0 .04em; }
.hero h1 .red { color: var(--brand); }
.hero-lead { font-size: clamp(15px, 3.8vw, 18px); margin: 0; max-width: 30em; font-weight: 600; }
.hero-cta { display: grid; gap: 12px; max-width: 420px; }
.hero-note { font-size: 12px; color: var(--muted); margin: 0; }
.hero-chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 520px; }
.hero-chars a { display: block; text-decoration: none; }
.hero-chars a:nth-child(odd) svg { transform: rotate(-6deg); }
.hero-chars a:nth-child(even) svg { transform: rotate(5deg) translateY(8px); }
.hero-chars svg { display: block; width: 100%; height: auto; transition: transform .15s ease; }
.hero-chars a:hover svg { transform: scale(1.08); }
@media (min-width: 860px) {
  .hero .inner { grid-template-columns: 1.15fr 1fr; align-items: center; padding-top: 72px; padding-bottom: 80px; }
  .hero-chars { grid-row: 1 / span 5; grid-column: 2; }
}

/* ---- Steps ---- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 2px solid var(--line); }
.steps li { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; padding: 20px 0; border-bottom: 2px solid var(--line); }
.steps .no { grid-row: span 2; font-size: 44px; font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.steps b { font-size: 19px; font-weight: 900; line-height: 1.4; }
.steps p { margin: 0; color: var(--muted); font-size: 14px; }
@media (min-width: 860px) {
  .steps { grid-template-columns: repeat(3, 1fr); border-top: 0; border-left: 2px solid var(--line); }
  .steps li { grid-template-columns: 1fr; padding: 4px 24px 8px; border-bottom: 0; border-right: 2px solid var(--line); }
  .steps .no { grid-row: auto; margin-bottom: 8px; }
}

/* ---- Axes ---- */
.axes { display: grid; gap: 0; border-top: 2px solid var(--line); max-width: 720px; }
.axis-item { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 2px solid var(--line); }
.axis-item .ax-name { font-size: 28px; font-weight: 900; text-align: center; }
.axis-item .ax-sides { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.axis-item .side b { display: block; font-size: 17px; font-weight: 900; }
.axis-item .side small { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }
.axis-item .side.r { text-align: right; }
.axis-item .vs { font-weight: 900; font-size: 13px; color: var(--muted); }
.code-chip { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; margin-right: 4px; background: var(--text); color: var(--bg); font-size: .85em; vertical-align: .05em; }
.side.r .code-chip { margin: 0 0 0 4px; }

/* ---- Type tiles ---- */
.type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2px solid var(--line); border-left: 2px solid var(--line); }
@media (min-width: 860px) { .type-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.type-tile {
  --c: var(--brand);
  position: relative; display: block; text-decoration: none; padding: 14px 14px 18px;
  border-right: 2px solid var(--line); border-bottom: 2px solid var(--line);
  background: var(--bg); transition: background-color .15s ease;
}
.type-tile:hover { background: color-mix(in srgb, var(--c) 12%, var(--bg)); }
.type-tile::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: var(--c); }
.type-tile svg { width: 78%; height: auto; display: block; margin: 8px auto 6px; }
.type-tile .tc-code { font-size: 12px; font-weight: 900; color: var(--c); letter-spacing: .14em; }
.type-tile .tc-name { font-size: 20px; font-weight: 900; line-height: 1.3; }
.type-tile .tc-sum { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 4px; }


/* ---- Final CTA ---- */
.cta-band { background: var(--accent); color: var(--on-accent); text-align: center; padding: 64px 0; border-bottom: 2px solid var(--line); }
.cta-band h2 { font-size: clamp(26px, 7vw, 44px); font-weight: 900; line-height: 1.3; margin: 0 0 8px; }
.cta-band p { margin: 0 0 28px; font-weight: 700; }
.cta-band .btn { background: var(--bg); color: var(--text); }

/* ---- Footer ---- */
.site-foot { padding: 32px 0 40px; font-size: 12px; color: var(--muted); }
.site-foot .inner { display: grid; gap: 8px; }
.site-foot nav { display: flex; flex-wrap: wrap; gap: 4px 16px; font-weight: 700; color: var(--text); }
.site-foot nav a { text-decoration: none; }
.site-foot p { margin: 0; }

/* ---- Quiz ---- */
.quiz { padding: 28px 0 64px; min-height: calc(100vh - 56px); background: var(--bg-2); }
.progress-row { display: flex; align-items: center; gap: 12px; }
.progress { flex: 1; height: 12px; background: var(--bg); border: 2px solid var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); transition: width .25s ease; }
.progress-num { font-size: 15px; font-weight: 900; min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
.q-label { font-size: 56px; font-weight: 900; line-height: 1; color: var(--brand); margin: 32px 0 8px; font-variant-numeric: tabular-nums; }
.q-text { font-size: clamp(24px, 7vw, 34px); font-weight: 900; line-height: 1.4; margin: 0 0 28px; }
.choices { display: grid; gap: 14px; }
.choice {
  display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px;
  padding: 14px 18px; text-align: left; cursor: pointer;
  background: var(--bg); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line);
  font-size: 18px; font-weight: 800; line-height: 1.45;
  transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
}
.choice:hover { background: color-mix(in srgb, var(--brand-2) 22%, var(--bg)); }
.choice:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.choice .tag { flex: none; display: grid; place-items: center; width: 38px; height: 38px; background: var(--text); color: var(--bg); font-weight: 900; font-size: 17px; }
.choice.picked { background: var(--brand-2); color: #1C1A22; transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.choice.picked .tag { background: #1C1A22; color: #FFF; }
.back-link { margin-top: 24px; background: none; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; padding: 8px 0; text-decoration: underline; }
.back-link:disabled { visibility: hidden; }

/* ---- Result ---- */
.fade-in { animation: fadeIn .5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade-in { animation: none; }
  * { transition: none !important; scroll-behavior: auto !important; }
}

.r-hero { background: var(--accent); color: var(--on-accent); border-bottom: 2px solid var(--line); position: relative; overflow: hidden; }
.r-hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .14;
  background-image: repeating-linear-gradient(-45deg, currentColor 0 2px, transparent 2px 18px);
}
.r-hero .inner { position: relative; padding-top: 32px; padding-bottom: 40px; text-align: center; }
.r-eyebrow { display: inline-block; font-size: 13px; font-weight: 900; letter-spacing: .08em; background: var(--on-accent); color: var(--accent); padding: 4px 12px; margin: 0; }
.type-title { font-size: clamp(52px, 17vw, 104px); font-weight: 900; line-height: 1.1; margin: 12px 0 8px; letter-spacing: .02em; }
.code-badges { display: inline-flex; gap: 6px; }
.code-badges span { display: grid; place-items: center; width: 44px; height: 44px; background: var(--on-accent); color: var(--accent); font-weight: 900; font-size: 22px; }
.r-illust { width: min(240px, 62vw); margin: 20px auto 0; background: var(--bg); border: 2px solid var(--line); border-radius: 50%; padding: 8px; }
.r-illust svg { width: 100%; height: auto; display: block; }
.r-summary { margin: 16px auto 0; font-weight: 800; font-size: 16px; max-width: 26em; }

.r-sec { padding: 40px 0; border-bottom: 2px solid var(--line); }
.r-sec.alt { background: var(--tint); }
.r-h { font-size: 22px; font-weight: 900; line-height: 1.4; margin: 0 0 18px; }
.r-h .kicker { margin-bottom: 2px; }

.axis-row + .axis-row { margin-top: 18px; }
.axis-labels { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 8px; gap: 8px; }
.axis-labels .on { color: var(--accent); }
.axis-labels .off { color: var(--muted); font-weight: 600; }
.axis-track { position: relative; height: 14px; background: var(--bg); border: 2px solid var(--line); margin: 0 11px; }
.axis-track::after { content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--line); }
.axis-track i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 55%, transparent); }
.axis-track b { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--line); z-index: 1; }
.axis-ratio { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

.desc { margin: 0 0 24px; font-size: 16px; }
.why-box { border: 2px solid var(--line); background: var(--bg); padding: 18px 18px 20px; box-shadow: 6px 6px 0 var(--accent); }
.why-box p { margin: 0; font-size: 16px; font-weight: 700; }
.why-box .why-lead { font-size: 13px; font-weight: 900; color: var(--accent); margin-bottom: 8px; }

.genres { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
.genres li { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; padding: 18px 0; border-bottom: 2px solid var(--line); }
.genres .num { grid-row: span 3; font-size: 36px; font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.genres .cat { font-size: 12px; font-weight: 800; color: var(--muted); }
.genres b { font-size: 20px; font-weight: 900; line-height: 1.35; }
.genres .w { font-size: 14px; color: var(--muted); }

.events { border-top: 2px solid var(--line); }
.event { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 16px 0; border-bottom: 2px solid var(--line); }
.event .g { grid-column: 1 / -1; font-size: 12px; font-weight: 900; color: var(--accent); }
.event h3 { margin: 0; font-size: 18px; font-weight: 900; }
.event .price { font-weight: 900; font-size: 16px; text-align: right; white-space: nowrap; }
.event .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.dummy-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

.share-row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.share-row .btn { padding: 12px 8px; font-size: 15px; }
.share-row .btn.x { background: #0F0F0F; color: #FFFFFF; }
.copied { font-size: 13px; text-align: center; min-height: 1.5em; margin: 10px 0 0; font-weight: 800; }
.end-row { display: grid; gap: 14px; }
@media (min-width: 600px) { .end-row { grid-template-columns: 1fr 1fr; } }

.page-head { padding: 40px 0 28px; }
.page-head .sec-h { margin-bottom: 8px; }
.page-head p { color: var(--muted); margin: 0; }

[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="site-head">
  <div class="inner">
    <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span>エンタメタイプ診断</a>
    <nav class="head-nav" aria-label="メニュー">
      <a class="txt" href="#/types">8タイプ一覧</a>
      <a class="btn small" href="#/quiz" data-start>診断する</a>
    </nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer class="site-foot">
  <div class="inner">
    <nav aria-label="フッター">
      <a href="#/">トップ</a><a href="#/quiz" data-start>診断をはじめる</a><a href="#/types">8タイプ一覧</a>
    </nav>
    <p>個人情報は取得しません。公演情報はサンプルです。</p>
  </div>
</footer>

<script>
(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const app = document.getElementById('app');
  const root = document.documentElement;
  const AXES = DATA.axes;
  const QUESTIONS = DATA.questions;
  const TYPES = DATA.types;
  const TYPE_ORDER = DATA.typeOrder && DATA.typeOrder.length ? DATA.typeOrder : Object.keys(TYPES);

  // 回答はメモリ上だけに保持（保存・送信はしない）
  const state = { answers: [], index: 0, result: null, locked: false };

  validateData();

  // ---------- utils ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function axisById(id) { return AXES.find(a => a.id === id); }

  function sideOf(code) {
    for (const a of AXES) for (const s of a.sides) if (s.code === code) return { axis: a, side: s };
    return null;
  }

  // 背景色に対して読みやすい文字色（白 or 濃色）を返す
  function onColor(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    const L = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    return (1.05) / (L + 0.05) >= 3 ? '#FFFFFF' : '#1B1A1F';
  }

  function setTheme(color) {
    if (color) {
      root.style.setProperty('--accent', color);
      root.style.setProperty('--on-accent', onColor(color));
    } else {
      root.style.removeProperty('--accent');
      root.style.removeProperty('--on-accent');
    }
  }

  function resetQuiz() { state.answers = []; state.index = 0; state.result = null; }

  function validateData() {
    AXES.forEach(a => {
      const n = QUESTIONS.filter(q => q.axis === a.id).length;
      if (n % 2 === 0) console.warn('[診断データ] 軸「' + a.name + '」の質問数が偶数です（同点が起きる可能性があります）');
    });
    QUESTIONS.forEach((q, i) => {
      const a = axisById(q.axis);
      const codes = a ? a.sides.map(s => s.code) : [];
      if (!a || !codes.includes(q.a.value) || !codes.includes(q.b.value) || q.a.value === q.b.value) {
        console.warn('[診断データ] 質問' + (i + 1) + 'の axis / value が正しくありません');
      }
    });
  }

  // ロゴの色ドット（8タイプの色）
  document.querySelector('.logo-mark').innerHTML = TYPE_ORDER.map(c => `<i style="background:${esc(TYPES[c].color)}"></i>`).join('');

  // 「診断をはじめる」系のリンクは、どこから押しても回答をリセットする
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-start]')) return;
    resetQuiz();
    // すでに質問画面にいる場合は hashchange が起きないので、ここで描き直す
    if (location.hash === '#/quiz') { e.preventDefault(); route(); }
  });

  // ---------- illustration ----------
  const INK = '#2B2733';
  const ACCESSORIES = {
    'hands-up': c => ({
      back: `<path d="M48 120 L22 62" stroke="${c}" stroke-width="14" stroke-linecap="round"/>
             <path d="M152 120 L178 62" stroke="${c}" stroke-width="14" stroke-linecap="round"/>
             <circle cx="22" cy="58" r="10" fill="${c}"/><circle cx="178" cy="58" r="10" fill="${c}"/>
             <path d="M8 40l8 6M30 30l-2 10M192 40l-8 6M170 30l2 10" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`,
      mouth: `<path d="M86 132 Q100 156 114 132 Z" fill="${INK}"/><path d="M93 142 Q100 150 107 142" fill="#F37C8E"/>`
    }),
    'bubble': c => ({
      front: `<g transform="translate(122 20)"><path d="M6 0h56a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12H26l-14 12 2-12H6A12 12 0 0 1-6 34V12A12 12 0 0 1 6 0z" fill="#fff" stroke="${INK}" stroke-width="4"/>
              <circle cx="18" cy="23" r="5" fill="${c}"/><circle cx="34" cy="23" r="5" fill="${c}"/><circle cx="50" cy="23" r="5" fill="${c}"/></g>`
    }),
    'penlight': c => ({
      front: `<path d="M150 138 L174 70" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
              <path d="M174 70 L186 34" stroke="${c}" stroke-width="12" stroke-linecap="round"/>
              <path d="M174 70 L186 34" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
              <circle cx="150" cy="138" r="11" fill="${c}" stroke="${INK}" stroke-width="3"/>
              <path d="M30 48c0-7 10-9 12-2 2-7 12-5 12 2 0 8-12 14-12 14s-12-6-12-14z" fill="${c}"/>`
    }),
    'stamp': c => ({
      front: `<g transform="translate(118 116) rotate(-8)"><rect x="0" y="0" width="70" height="46" rx="8" fill="#fff" stroke="${INK}" stroke-width="4"/>
              <circle cx="16" cy="16" r="7" fill="${c}"/><circle cx="35" cy="16" r="7" fill="${c}"/><circle cx="54" cy="16" r="7" fill="${c}"/>
              <circle cx="16" cy="32" r="7" fill="${c}"/><circle cx="35" cy="32" r="7" fill="none" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="54" cy="32" r="7" fill="none" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3"/></g>`
    }),
    'headphones': c => ({
      front: `<path d="M44 104 C44 40 156 40 156 104" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
              <rect x="30" y="94" width="24" height="40" rx="11" fill="${INK}"/><rect x="146" y="94" width="24" height="40" rx="11" fill="${INK}"/>
              <path d="M172 40v-18l14-4v18" fill="none" stroke="${c}" stroke-width="4"/><circle cx="168" cy="40" r="5" fill="${c}"/><circle cx="182" cy="36" r="5" fill="${c}"/>`,
      eyes: `<path d="M74 110 Q82 118 90 110" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>
             <path d="M110 110 Q118 118 126 110" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`
    }),
    'glasses': c => ({
      eyes: `<circle cx="82" cy="108" r="5" fill="${INK}"/><circle cx="118" cy="108" r="5" fill="${INK}"/>
             <circle cx="82" cy="108" r="15" fill="#fff" fill-opacity=".25" stroke="${INK}" stroke-width="4"/>
             <circle cx="118" cy="108" r="15" fill="#fff" fill-opacity=".25" stroke="${INK}" stroke-width="4"/>
             <path d="M97 106h6" stroke="${INK}" stroke-width="4"/>`,
      front: `<text x="160" y="56" font-size="40" font-weight="900" fill="${c}" font-family="system-ui, sans-serif">?</text>
              <circle cx="38" cy="44" r="5" fill="${c}"/><circle cx="26" cy="62" r="3" fill="${c}"/>`
    }),
    'flag': c => ({
      back: `<path d="M150 150 L166 30" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
             <path d="M166 32 L196 44 L163 58 Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`,
      front: `<circle cx="150" cy="150" r="11" fill="${c}" stroke="${INK}" stroke-width="3"/>
              <path d="M26 54l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="${c}"/>`
    }),
    'magnifier': c => ({
      front: `<path d="M150 150 L176 176" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>
              <circle cx="138" cy="138" r="22" fill="#fff" fill-opacity=".5" stroke="${INK}" stroke-width="7"/>
              <path d="M30 40l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="${c}"/>
              <path d="M170 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="${c}"/>`
    })
  };

  function charSVG(code, opts) {
    const t = TYPES[code];
    const c = t.color;
    const o = opts || {};
    const acc = (ACCESSORIES[t.illust] || (() => ({})))(c);
    const eyes = acc.eyes || `<circle cx="82" cy="108" r="6" fill="${INK}"/><circle cx="118" cy="108" r="6" fill="${INK}"/>
      <circle cx="84" cy="106" r="2" fill="#fff"/><circle cx="120" cy="106" r="2" fill="#fff"/>`;
    const mouth = acc.mouth || `<path d="M90 130 Q100 140 110 130" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    const halo = o.noHalo ? '' : `<circle cx="100" cy="104" r="92" fill="${c}" fill-opacity=".14"/>`;
    return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(t.name + 'のキャラクター')}" xmlns="http://www.w3.org/2000/svg">
      ${halo}
      ${acc.back || ''}
      <ellipse cx="100" cy="182" rx="48" ry="7" fill="${INK}" opacity=".12"/>
      <path d="M100 46c38 0 60 32 60 72 0 38-26 60-60 60s-60-22-60-60c0-40 22-72 60-72z" fill="${c}"/>
      <ellipse cx="80" cy="72" rx="15" ry="9" fill="#fff" opacity=".28" transform="rotate(-20 80 72)"/>
      <circle cx="68" cy="126" r="8" fill="#FF8FA3" opacity=".55"/><circle cx="132" cy="126" r="8" fill="#FF8FA3" opacity=".55"/>
      ${eyes}${mouth}
      ${acc.front || ''}
    </svg>`;
  }

  // ---------- scoring ----------
  function computeResult(answers) {
    const counts = {};
    AXES.forEach(a => a.sides.forEach(s => { counts[s.code] = 0; }));
    answers.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
    const axes = AXES.map(a => {
      const [s0, s1] = a.sides;
      const n0 = counts[s0.code], n1 = counts[s1.code];
      const win = n0 >= n1 ? s0 : s1;
      return { axis: a, win: win, counts: [n0, n1] };
    });
    return { code: axes.map(x => x.win.code).join(''), axes: axes };
  }

  // ---------- parts ----------
  function typeGrid() {
    return `<div class="type-grid">
      ${TYPE_ORDER.map(code => {
        const t = TYPES[code];
        return `<a class="type-tile" href="#/types/${esc(code)}" style="--c:${esc(t.color)}">
          ${charSVG(code)}
          <div class="tc-code">${esc(code)}</div>
          <div class="tc-name">${esc(t.name)}</div>
          <div class="tc-sum">${esc(t.summary)}</div>
        </a>`;
      }).join('')}
    </div>`;
  }

  function ctaBand() {
    return `<section class="cta-band">
      <div class="inner narrow">
        <h2>次のエンタメ、<br>楽しみ方で選ぼう。</h2>
        <p>${esc(DATA.meta.duration)}</p>
        <a class="btn" href="#/quiz" data-start>診断をはじめる</a>
      </div>
    </section>`;
  }

  // ---------- views ----------
  function viewTop() {
    setTheme(null);
    const m = DATA.meta;
    app.innerHTML = `
      <section class="hero fade-in">
        <div class="inner">
          <span class="hero-badge"><b>${esc(m.duration)}</b>で診断</span>
          <h1>その「好き」、<br><span class="mark">別のジャンル</span>でも<br><span class="red">楽しめる。</span></h1>
          <p class="hero-lead">${esc(m.lead)}</p>
          <div class="hero-cta">
            <a class="btn block" href="#/quiz" data-start>診断をはじめる</a>
            <p class="hero-note">個人情報の入力なし</p>
          </div>
          <div class="hero-chars">${TYPE_ORDER.map(c => `<a href="#/types/${esc(c)}" aria-label="${esc(TYPES[c].name)}">${charSVG(c, { noHalo: true })}</a>`).join('')}</div>
        </div>
      </section>

      <section class="sec">
        <div class="inner">
          <span class="kicker">ABOUT</span>
          <h2 class="sec-h">性格じゃなくて、<br>「楽しみ方」を診断。</h2>
          <ol class="steps">
            <li><span class="no">01</span><b>9問に答える</b><p>2択をタップするだけ</p></li>
            <li><span class="no">02</span><b>8タイプを判定</b><p>3つの軸の傾きから</p></li>
            <li><span class="no">03</span><b>次のジャンルへ</b><p>おすすめジャンルと公演</p></li>
          </ol>
        </div>
      </section>

      <section class="sec alt">
        <div class="inner">
          <span class="kicker">3 AXES</span>
          <h2 class="sec-h">3つの軸 × 2 ＝ 8タイプ</h2>
          <div class="axes">
            ${AXES.map(a => {
              const [s0, s1] = a.sides;
              return `<div class="axis-item">
                <span class="ax-name">${esc(a.name)}</span>
                <div class="ax-sides">
                  <div class="side"><b><span class="code-chip">${esc(s0.code)}</span>${esc(s0.label)}</b><small>${esc(s0.desc)}</small></div>
                  <span class="vs">or</span>
                  <div class="side r"><b>${esc(s1.label)}<span class="code-chip">${esc(s1.code)}</span></b><small>${esc(s1.desc)}</small></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="inner">
          <span class="kicker">8 TYPES</span>
          <h2 class="sec-h">あなたはどのタイプ？</h2>
          ${typeGrid()}
        </div>
      </section>


      ${ctaBand()}`;
  }

  function viewQuiz() {
    setTheme(null);
    if (state.index >= QUESTIONS.length) state.index = 0;
    const i = state.index;
    const q = QUESTIONS[i];
    const total = QUESTIONS.length;
    const picked = state.answers[i];
    app.innerHTML = `
      <section class="quiz">
        <div class="inner narrow fade-in" style="animation-duration:.25s">
          <div class="progress-row">
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${i}" aria-label="進捗"><i style="width:${(i / total) * 100}%"></i></div>
            <span class="progress-num">${i + 1} / ${total}</span>
          </div>
          <p class="q-label">Q${i + 1}</p>
          <h1 class="q-text">${esc(q.text)}</h1>
          <div class="choices">
            ${['a', 'b'].map(k => `
              <button type="button" class="choice${picked === q[k].value ? ' picked' : ''}" data-value="${esc(q[k].value)}">
                <span class="tag">${k.toUpperCase()}</span><span>${esc(q[k].text)}</span>
              </button>`).join('')}
          </div>
          <button type="button" class="back-link" data-back ${i === 0 ? 'disabled' : ''}>← 前の質問に戻る</button>
        </div>
      </section>`;
    state.locked = false;

    app.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.locked) return;
        state.locked = true;
        app.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        state.answers[i] = btn.dataset.value;
        app.querySelector('.progress > i').style.width = ((i + 1) / total) * 100 + '%';
        setTimeout(() => {
          if (i + 1 < total) {
            state.index = i + 1;
            viewQuiz();
          } else if (isComplete()) {
            state.result = computeResult(state.answers);
            location.hash = '#/result';
          } else {
            // 未回答が残っていれば最初の未回答へ
            state.index = firstUnanswered();
            viewQuiz();
          }
        }, 220);
      });
    });
    app.querySelector('[data-back]').addEventListener('click', () => {
      if (state.index > 0) { state.index -= 1; viewQuiz(); }
    });
  }

  function isComplete() {
    if (state.answers.length !== QUESTIONS.length) return false;
    return QUESTIONS.every((q, i) => state.answers[i] === q.a.value || state.answers[i] === q.b.value);
  }
  function firstUnanswered() {
    for (let i = 0; i < QUESTIONS.length; i++) if (!state.answers[i]) return i;
    return 0;
  }

  function axisBlock(result, code) {
    // result がある場合は比率、ない場合（タイプ詳細）はどちら側かだけを表示
    return AXES.map((a, idx) => {
      const [s0, s1] = a.sides;
      let n0, n1, winCode;
      if (result) {
        const r = result.axes[idx];
        n0 = r.counts[0]; n1 = r.counts[1]; winCode = r.win.code;
      } else {
        winCode = code[idx];
        n0 = winCode === s0.code ? 3 : 0; n1 = 3 - n0;
      }
      // 中央を0として、多い側へ差の分だけ寄せる（3:0なら端、2:1なら1/3ほど）
      const total = n0 + n1 || 1;
      const pos = 50 - ((n0 - n1) / total) * 50;
      const from = Math.min(pos, 50), width = Math.abs(pos - 50);
      return `<div class="axis-row">
        <div class="axis-labels">
          <span class="${winCode === s0.code ? 'on' : 'off'}">${esc(s0.code)} ${esc(s0.label)}</span>
          <span class="${winCode === s1.code ? 'on' : 'off'}">${esc(s1.label)} ${esc(s1.code)}</span>
        </div>
        <div class="axis-track" aria-hidden="true"><i style="left:${from}%;width:${width}%"></i><b style="left:${pos}%"></b></div>
        <div class="axis-ratio">${result ? `${esc(a.name)}：${esc(s0.label)} ${n0} : ${n1} ${esc(s1.label)}` : `${esc(a.name)}：${esc(sideOf(winCode).side.desc)}`}</div>
      </div>`;
    }).join('');
  }

  function typeBody(code, result) {
    const t = TYPES[code];
    const eventsCount = Math.min(3, Math.max(2, t.events.length));
    return `
      <section class="r-hero">
        <div class="inner narrow">
          <p class="r-eyebrow">${result ? 'あなたの楽しみ方タイプは' : 'TYPE ' + esc(code)}</p>
          <h1 class="type-title">${esc(t.name)}</h1>
          <div class="code-badges" aria-label="タイプコード ${esc(code)}">${code.split('').map(ch => `<span title="${esc(sideOf(ch).side.label)}">${esc(ch)}</span>`).join('')}</div>
          <div class="r-illust">${charSVG(code, { noHalo: true })}</div>
          <p class="r-summary">${esc(t.summary)}</p>
        </div>
      </section>

      <section class="r-sec">
        <div class="inner narrow">
          <h2 class="r-h"><span class="kicker">BALANCE</span>${result ? 'あなたの3軸の傾き' : '3軸の傾き'}</h2>
          ${axisBlock(result, code)}
        </div>
      </section>

      <section class="r-sec alt">
        <div class="inner narrow">
          <h2 class="r-h"><span class="kicker">ABOUT</span>${esc(t.name)}ってどんなタイプ？</h2>
          <p class="desc">${esc(t.description)}</p>
          <div class="why-box">
            <p class="why-lead">あなたがいつものジャンルを好きなのは、たぶんこの理由</p>
            <p>${esc(t.reason)}</p>
          </div>
        </div>
      </section>

      <section class="r-sec">
        <div class="inner narrow">
          <h2 class="r-h"><span class="kicker">NEXT GENRE</span>同じ楽しみ方ができるジャンル</h2>
          <ol class="genres">
            ${t.genres.slice(0, 3).map((g, k) => `<li>
              <span class="num">0${k + 1}</span>
              ${g.category ? `<span class="cat">${esc(g.category)}</span>` : ''}
              <b>${esc(g.name)}</b>
              <span class="w">${esc(g.why)}</span>
            </li>`).join('')}
          </ol>
        </div>
      </section>

      <section class="r-sec alt">
        <div class="inner narrow">
          <h2 class="r-h"><span class="kicker">PICK UP</span>おすすめ公演</h2>
          <div class="events">
            ${t.events.slice(0, eventsCount).map(e => `
              <article class="event">
                <span class="g">${esc(e.genre)}</span>
                <h3>${esc(e.title)}</h3>
                <span class="price">${esc(e.price)}</span>
                <span class="meta">${esc(e.date)}　${esc(e.venue)}</span>
              </article>`).join('')}
          </div>
          <p class="dummy-note">※ サンプル</p>
        </div>
      </section>`;
  }

  function shareText(code) {
    const t = TYPES[code];
    return `私のエンタメタイプは「${code} ${t.name}」\n次に試したいジャンル：${t.genres.slice(0, 3).map(g => g.name).join('・')}`;
  }

  function viewResult() {
    if (!state.result || !isComplete()) {
      // 9問に回答していない場合は結果を表示しない
      location.replace('#/');
      return;
    }
    const code = state.result.code;
    const t = TYPES[code];
    if (!t) { console.warn('[診断データ] タイプ ' + code + ' が定義されていません'); location.replace('#/'); return; }
    setTheme(t.color);
    const tag = DATA.meta.hashtag;
    const text = shareText(code);
    const pageUrl = /^https?:/.test(location.protocol) ? location.href.split('#')[0] : '';
    const intent = 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&hashtags=' + encodeURIComponent(tag) + (pageUrl ? '&url=' + encodeURIComponent(pageUrl) : '');

    app.innerHTML = `
      <div class="fade-in" data-result="${esc(code)}">
        ${typeBody(code, state.result)}
        <section class="r-sec">
          <div class="inner narrow">
            <h2 class="r-h"><span class="kicker">SHARE</span>結果をシェア</h2>
            <div class="share-row">
              <button type="button" class="btn ghost no-arrow" data-copy>結果をコピー</button>
              <a class="btn x no-arrow" href="${esc(intent)}" target="_blank" rel="noopener noreferrer">𝕏 でポスト</a>
            </div>
            <p class="copied" data-copied role="status"></p>
            <div class="end-row" style="margin-top:24px">
              <a class="btn" href="#/quiz" data-start>もう一度診断する</a>
              <a class="btn ghost" href="#/types">8タイプ一覧を見る</a>
            </div>
          </div>
        </section>
      </div>`;

    app.querySelector('[data-copy]').addEventListener('click', () => {
      copyText(text + '\n#' + tag + (pageUrl ? '\n' + pageUrl : '')).then(ok => {
        app.querySelector('[data-copied]').textContent = ok ? 'コピーしました！' : 'コピーできませんでした';
      });
    });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function viewTypes() {
    setTheme(null);
    app.innerHTML = `
      <div class="fade-in">
        <section class="page-head">
          <div class="inner">
            <span class="kicker">8 TYPES</span>
            <h1 class="sec-h">8タイプ一覧</h1>
          </div>
        </section>
        <section style="padding-bottom:64px">
          <div class="inner">${typeGrid()}</div>
        </section>
        ${ctaBand()}
      </div>`;
  }

  function viewTypeDetail(code) {
    const t = TYPES[code];
    if (!t) { location.replace('#/types'); return; }
    setTheme(t.color);
    app.innerHTML = `
      <div class="fade-in" data-detail="${esc(code)}">
        ${typeBody(code, null)}
        <section class="r-sec">
          <div class="inner narrow end-row">
            <a class="btn" href="#/quiz" data-start>自分のタイプを診断する</a>
            <a class="btn ghost" href="#/types">8タイプ一覧に戻る</a>
          </div>
        </section>
      </div>`;
  }

  // ---------- router ----------
  function route() {
    const h = location.hash.replace(/^#/, '') || '/';
    const parts = h.split('/').filter(Boolean);
    if (parts[0] === 'quiz') viewQuiz();
    else if (parts[0] === 'result') viewResult();
    else if (parts[0] === 'types' && parts[1]) viewTypeDetail(decodeURIComponent(parts[1]).toUpperCase());
    else if (parts[0] === 'types') viewTypes();
    else viewTop();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
