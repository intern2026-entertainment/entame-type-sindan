    ['.site-head', '#app', '.site-foot', '.tabbar', '.toasts'].forEach(sel => { const el = document.querySelector(sel); if (el) el.inert = true; });
    introBox.querySelectorAll('[data-start-mode]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.startMode === 'present') { closeIntro(); startPresent(true); return; }
      startWith(b.dataset.startMode);
      closeIntro();
      route();
      if (b.dataset.startMode === 'random') toast('ランダムな途中の状態を作りました', 'shuffle');
      if (b.dataset.startMode === 'fresh') toast('はじめから始めます', 'play');
    }));
    const first = introBox.querySelector('[data-start-mode]');
    if (first) first.focus({ preventScroll: true });
  }
  function closeIntro() {
    if (!introBox) return;
    introBox.remove();
    introBox = null;
    document.body.classList.remove('intro-open');
    ['.site-head', '#app', '.site-foot', '.tabbar', '.toasts'].forEach(sel => { const el = document.querySelector(sel); if (el) el.inert = false; });
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-intro]')) return;
    e.preventDefault();
    openIntro();
  });

  // ---------- プレゼンモード ----------
  // ?present で開くと説明を出さずにこのモードから始まる。← → / PageUp PageDown で移動、F でフォーカス切替、Esc で終了
  const PRESENT_STEPS = [
    { grp: '診断', ic: 'home', title: 'トップ', cap: '9問・1分半で、楽しみ方を8タイプに', hash: '#/', focus: 'hero' },
    { grp: '診断', ic: 'compass', title: '3つの軸', cap: '場・人・対象の組み合わせでタイプが決まる', hash: '#/', focus: 'axes' },
    { grp: '診断', ic: 'clock', title: '質問', cap: '2択を9問。選ぶと次へ進む', hash: '#/quiz', focus: 'quiz', prep: () => resetQuiz() },
    { grp: '診断結果', ic: 'star', title: 'タイプ', cap: 'タイプ名とキャラクター', hash: '#/result', focus: 'type', prep: ensureResult },
    { grp: '診断結果', ic: 'compass', title: '3軸の傾き', cap: '回答の比率をそのまま表示', hash: '#/result', focus: 'balance', prep: ensureResult },
    { grp: '診断結果', ic: 'arrow', title: '次のジャンル', cap: '同じ楽しみ方ができる、別のジャンル', hash: '#/result', focus: 'next', prep: ensureResult },
    { grp: '診断結果', ic: 'ticket', title: 'おすすめ公演', cap: '「行った！」で体験として記録', hash: '#/result', focus: 'events', prep: ensureResult },
    { grp: '診断結果', ic: 'share', title: 'シェア', cap: 'コピーとXへの投稿', hash: '#/result', focus: 'share', prep: ensureResult },
    { grp: 'マイページ', ic: 'user', title: 'プロフィール', cap: 'タイプ・称号・ポイント', hash: '#/me', focus: 'profile' },
    { grp: 'マイページ', ic: 'compass', title: '開拓タイプ', cap: '体験したジャンルの数で称号が変わる', hash: '#/me', focus: 'explore' },
    { grp: 'マイページ', ic: 'medal', title: '体験実績', cap: '条件を満たすとバッジを獲得', hash: '#/me', focus: 'badges' },
    { grp: 'マイページ', ic: 'heart', title: '推しカラー', cap: 'バッジやシールの色を変えられる', hash: '#/me', focus: 'oshi' },
    { grp: 'マイページ', ic: 'flag', title: 'ミッション', cap: '達成するとポイント', hash: '#/missions', focus: 'missions' },
    { grp: 'マイページ', ic: 'grid', title: 'ジャンル図鑑', cap: '大ジャンルごとの開拓状況', hash: '#/genres', focus: 'genres' },
    { grp: 'マイページ', ic: 'gift', title: '交換所', cap: 'ポイントでシール・称号と交換', hash: '#/shop', focus: 'shop' },
    { grp: 'マイページ', ic: 'book', title: 'プロフ帳', cap: 'ロゴやシールを貼って、PNGで保存', hash: '#/book', focus: 'book' }
  ];
  const present = { on: false, i: 0, spot: true, bar: null, box: null, raf: 0, target: null, seq: 0 };
  // ?present&embed はPCで開いたスマホ枠の中身。枠の外（親）とは postMessage でやりとりする
  const EMBED = /[?&]embed\b/.test(location.search) && window.parent !== window;
  const PRESENT_KEYS = ['ArrowRight', 'PageDown', 'ArrowLeft', 'PageUp', 'f', 'F', 'Escape'];
  let stage = null;

  // 結果画面を出すために、回答がなければプロフィールのタイプで9問を埋める
  function ensureResult() {
    if (state.result && isComplete()) return;
    const code = profile.type || pick(TYPE_ORDER);
    state.answers = QUESTIONS.map(q => code.includes(q.a.value) ? q.a.value : q.b.value);
    state.index = QUESTIONS.length - 1;
    state.result = computeResult(state.answers);
  }
  function presentFocusEl(step) {
    if (step.focus === 'missions') return app.querySelector('[data-focus^="mission-"]');
    return app.querySelector('[data-focus="' + step.focus + '"]');
  }
  function placeSpot() {
    present.raf = 0;
    if (!present.on) return;
    const el = present.target;
    if (!present.spot || !el || !el.isConnected) { present.box.hidden = true; return; }
    const r = el.getBoundingClientRect();
    const top = document.querySelector('.site-head').getBoundingClientRect().bottom;
    const bottom = present.bar.getBoundingClientRect().top;
    const pad = 6;
    const y1 = Math.max(r.top - pad, top + 4), y2 = Math.min(r.bottom + pad, bottom - 8);
    const x1 = Math.max(r.left - pad, 4), x2 = Math.min(r.right + pad, innerWidth - 4);
    present.box.hidden = y2 - y1 < 24;
    Object.assign(present.box.style, { top: y1 + 'px', left: x1 + 'px', width: (x2 - x1) + 'px', height: (y2 - y1) + 'px' });
  }
  function queueSpot() { if (present.on && !present.raf) present.raf = requestAnimationFrame(placeSpot); }
  function scrollToFocus(el) {
    const head = document.querySelector('.site-head').getBoundingClientRect().bottom;
    const room = present.bar.getBoundingClientRect().top - head;
    const r = el.getBoundingClientRect();
    const off = r.height + 24 < room ? (room - r.height) / 2 : 16;
    window.scrollBy({ top: r.top - head - off, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  function renderBar() {
    const s = PRESENT_STEPS[present.i], n = PRESENT_STEPS.length;
    present.bar.innerHTML = `
      <button type="button" class="pb-nav" data-pb="prev" aria-label="前へ"${present.i ? '' : ' disabled'}>${icon('prev')}</button>
      <div class="pb-main">
        <div class="pb-top">
          <span class="pb-no">${present.i + 1} / ${n}</span>
          <span class="pb-tools">
            <button type="button" data-pb="list" aria-label="一覧" aria-expanded="false">${icon('list')}</button>
            <button type="button" data-pb="spot" aria-label="フォーカス" aria-pressed="${present.spot}">${icon('focus')}</button>
            <button type="button" data-pb="exit" aria-label="プレゼンを終了">${icon('close')}</button>
          </span>
        </div>
        <b class="pb-title">${icon(s.ic)}<span>${esc(s.title)}</span></b>
        <p class="pb-cap">${esc(s.cap)}</p>
        <div class="pb-dots" aria-hidden="true">${PRESENT_STEPS.map((x, k) => `<i${k <= present.i ? ' class="on"' : ''}></i>`).join('')}</div>
      </div>
      <button type="button" class="pb-nav next" data-pb="next" aria-label="次へ"${present.i < n - 1 ? '' : ' disabled'}>${icon('arrow')}</button>`;
  }
  function toggleList(force) {
    let list = present.bar.querySelector('.pb-list');
    const open = force === undefined ? !list : force;
    if (list) list.remove();
    present.bar.querySelector('[data-pb="list"]').setAttribute('aria-expanded', String(open));
    if (!open) return;
    let grp = '';
    list = document.createElement('ul');
    list.className = 'pb-list';
    list.innerHTML = PRESENT_STEPS.map((s, k) => {
      const head = s.grp !== grp ? `<li class="grp">${esc(grp = s.grp)}</li>` : '';
      return `${head}<li><button type="button" data-pb-go="${k}"${k === present.i ? ' aria-current="step"' : ''}><small>${k + 1}</small>${icon(s.ic)}${esc(s.title)}</button></li>`;
    }).join('');
    present.bar.appendChild(list);
    const cur = list.querySelector('[aria-current]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function goStep(i) {
    i = Math.max(0, Math.min(PRESENT_STEPS.length - 1, i));
    present.i = i;
    const seq = ++present.seq;
    const s = PRESENT_STEPS[i];
    if (s.prep) s.prep();
    renderBar();
    present.target = null;
    present.box.hidden = true;
    const show = () => {
      if (seq !== present.seq) return;
      const el = presentFocusEl(s);
      present.target = el;
      if (el) scrollToFocus(el);
      queueSpot();
    };
    if (location.hash === s.hash || (s.hash === '#/' && !location.hash)) {
      if (s.focus === 'quiz' || !presentFocusEl(s)) route();
      setTimeout(show, 30);
    } else {
      window.addEventListener('hashchange', () => setTimeout(show, 30), { once: true });
      location.hash = s.hash;
    }
  }
  function startPresent(fromIntro) {
    if (fromIntro || !Object.keys(profile.shows).length) { startWith('random'); }
    if (!EMBED && innerWidth >= 600) { openStage(); return; }
    present.on = true;
    document.body.classList.add('presenting');
    present.box = document.createElement('div');
    present.box.className = 'spot';
    present.box.hidden = true;
    present.bar = document.createElement('div');
    present.bar.className = 'pbar';
    present.bar.setAttribute('role', 'region');
    present.bar.setAttribute('aria-label', 'プレゼン操作');
    document.body.append(present.box, present.bar);
    present.bar.addEventListener('click', e => {
      const go = e.target.closest('[data-pb-go]');
      if (go) { toggleList(false); goStep(+go.dataset.pbGo); return; }
      const b = e.target.closest('[data-pb]');
      if (!b) return;
      const a = b.dataset.pb;
      if (a === 'prev') goStep(present.i - 1);
      if (a === 'next') goStep(present.i + 1);
      if (a === 'list') toggleList();
      if (a === 'spot') { present.spot = !present.spot; b.setAttribute('aria-pressed', String(present.spot)); queueSpot(); }
      if (a === 'exit') stopPresent();
    });
    goStep(0);
  }
  function stopPresent() {
    if (!present.on) return;
    present.on = false;
    present.seq++;
    present.bar.remove();
    present.box.remove();
    present.bar = present.box = present.target = null;
    document.body.classList.remove('presenting');
    if (EMBED) { window.parent.postMessage({ entamePresent: 'exit' }, '*'); return; }
    if (/[?&]present\b/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
  }

  // PC：スマホ幅（390×844）の画面を画面の高さに合わせて拡大し、その中でプレゼンモードを動かす
  function fitStage() {
    if (!stage) return;
    const phone = stage.firstElementChild;
    const k = Math.min((innerHeight - 48) / 844, (innerWidth - 48) / 390);
    phone.style.transform = `scale(${k}) translate(-50%, -50%)`;
  }
  function openStage() {
    if (stage) return;
    stage = document.createElement('div');
    stage.className = 'stage';
    stage.innerHTML = `<div class="stage-phone"><iframe title="スマホ版の画面" src="${esc(location.pathname)}?present&amp;embed#/"></iframe></div>`;
    document.body.appendChild(stage);
    document.body.classList.add('staging');
    fitStage();
    const frame = stage.querySelector('iframe');
    frame.addEventListener('load', () => frame.focus());
  }
  function closeStage() {
    if (!stage) return;
    stage.remove();
    stage = null;
    document.body.classList.remove('staging');
    if (/[?&]present\b/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
    profile = loadProfile();
    resetQuiz();
    updateHeader();
    route();
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (!d.entamePresent) return;
    if (stage && e.source === stage.querySelector('iframe').contentWindow && d.entamePresent === 'exit') closeStage();
    if (EMBED && e.source === window.parent && d.entamePresent === 'key') presentKey(d.key);
  });
  window.addEventListener('scroll', queueSpot, { passive: true });
  window.addEventListener('resize', queueSpot);
  // 画面の中身が変わったら（図鑑のタブ切替など）枠を合わせ直す
  new MutationObserver(() => {
    if (!present.on) return;
    if (present.target && !present.target.isConnected) present.target = presentFocusEl(PRESENT_STEPS[present.i]);
    queueSpot();
  }).observe(app, { childList: true, subtree: true });
  function presentKey(k) {
    if (!present.on) return;
    if (k === 'ArrowRight' || k === 'PageDown') goStep(present.i + 1);
    else if (k === 'ArrowLeft' || k === 'PageUp') goStep(present.i - 1);
    else if (k === 'f' || k === 'F') { present.spot = !present.spot; const b = present.bar.querySelector('[data-pb="spot"]'); if (b) b.setAttribute('aria-pressed', String(present.spot)); queueSpot(); }
    else if (k === 'Escape') { if (present.bar.querySelector('.pb-list')) toggleList(false); else stopPresent(); }
  }
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || !PRESENT_KEYS.includes(e.key)) return;
    if (stage) {
      // 枠の外にフォーカスがあるときは、キーを枠の中へ渡す
      e.preventDefault();
      stage.querySelector('iframe').contentWindow.postMessage({ entamePresent: 'key', key: e.key }, '*');
      return;
    }
    if (!present.on || introBox) return;
    if (e.target.closest('input, textarea, select, [contenteditable]')) return;
    e.preventDefault();
    presentKey(e.key);
  });

  // ---------- router ----------
  function route() {
    const h = location.hash.replace(/^#/, '') || '/';
    const parts = h.split('/').filter(Boolean);
    document.body.dataset.route = parts[0] || 'top';
    document.querySelectorAll('[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === parts[0]));
    if (parts[0] === 'quiz') viewQuiz();
    else if (parts[0] === 'result') viewResult();
    else if (parts[0] === 'types' && parts[1]) viewTypeDetail(decodeURIComponent(parts[1]).toUpperCase());
    else if (parts[0] === 'types') viewTypes();
    else if (parts[0] === 'me') viewMe();
    else if (parts[0] === 'missions') viewMissions();
    else if (parts[0] === 'genres') viewGenres();
    else if (parts[0] === 'shop') viewShop();
    else if (parts[0] === 'book') viewBook();
    else viewTop();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
  updateHeader();
  route();
  // 開くたび（再読み込みのたび）にデモの説明を出す。?present ならプレゼンモードで開く
  if (EMBED) { document.documentElement.classList.add('embed'); document.body.classList.add('embed'); }
  if (/[?&]present\b/.test(location.search)) startPresent(false);
  else openIntro();
})();
</script>
</body>
</html>
