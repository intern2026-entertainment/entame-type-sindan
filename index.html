<style>
:root {
  --bg: #FFFDF8;
  --bg-2: #FFF3E2;
  --text: #1C1A22;
  --muted: #625C6E;
  --line: #1C1A22;
  --hair: #E6DCCF;
  --brand: #F2545B;
  --brand-2: #FFC53D;
  --accent: var(--brand);
  --on-accent: #FFFFFF;
  --tint: color-mix(in srgb, var(--accent) 10%, var(--bg));
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141218;
    --bg-2: #1E1B23;
    --text: #F4F0F8;
    --muted: #ADA6B8;
    --line: #F4F0F8;
    --hair: #34303B;
    --tint: color-mix(in srgb, var(--accent) 16%, var(--bg));
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, "Segoe UI", sans-serif;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
img, svg { max-width: 100%; }

.inner { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.inner.narrow { max-width: 680px; }

/* ---- Header ---- */
.site-head {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 2px solid var(--line);
}
.site-head .inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.logo-mark { display: grid; grid-template-columns: repeat(4, 6px); gap: 2px; }
.logo-mark i { width: 6px; height: 6px; }
.head-nav { display: flex; align-items: center; gap: 4px; }
.head-nav a.txt { font-size: 13px; font-weight: 700; text-decoration: none; padding: 8px; }
.head-nav a.txt:hover { text-decoration: underline; }
.me-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; text-decoration: none; padding: 6px 2px; white-space: nowrap; }
.me-link .pts { background: var(--text); color: var(--bg); padding: 2px 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
@media (max-width: 599px) { .hide-sm, .me-link .lbl { display: none; } .head-nav .btn.small::after { content: none; } }
@media (max-width: 400px) { .logo-mark { display: none; } .logo { font-size: 14px; } }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 14px 28px; border: 2px solid var(--line);
  background: var(--accent); color: var(--on-accent);
  font-weight: 900; font-size: 17px; letter-spacing: .02em; text-decoration: none; cursor: pointer;
  box-shadow: 4px 4px 0 var(--line);
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn::after { content: "→"; font-weight: 900; }
.btn.no-arrow::after { content: none; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--line); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.btn.block { display: flex; width: 100%; }
.btn.ghost { background: var(--bg); color: var(--text); }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: 14px; box-shadow: 3px 3px 0 var(--line); }
.btn:focus-visible, .choice:focus-visible, .type-tile:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 3px; }

/* ---- Common sections ---- */
.sec { padding: 64px 0; border-bottom: 2px solid var(--line); }
.sec.alt { background: var(--bg-2); }
.kicker { display: block; font-size: 13px; font-weight: 900; letter-spacing: .2em; color: var(--accent); margin-bottom: 6px; }
.sec-h { font-size: clamp(26px, 6.4vw, 40px); font-weight: 900; line-height: 1.3; margin: 0 0 20px; letter-spacing: .01em; }

/* ---- Hero ---- */
.hero { position: relative; overflow: hidden; border-bottom: 2px solid var(--line); background: var(--bg); }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.hero-bg i { position: absolute; display: block; }
.hero .inner { position: relative; padding-top: 40px; padding-bottom: 48px; display: grid; gap: 28px; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; justify-self: start; background: var(--text); color: var(--bg); font-weight: 900; font-size: 14px; padding: 6px 14px; letter-spacing: .04em; }
.hero-badge b { color: var(--brand-2); }
.hero h1 { font-size: clamp(36px, 10.5vw, 72px); line-height: 1.18; margin: 0; font-weight: 900; letter-spacing: -.01em; }
.hero h1 .mark { background: linear-gradient(transparent 62%, var(--brand-2) 62%); padding: 0 .04em; }
.hero h1 .red { color: var(--brand); }
.hero-lead { font-size: clamp(15px, 3.8vw, 18px); margin: 0; max-width: 30em; font-weight: 600; }
.hero-cta { display: grid; gap: 12px; max-width: 420px; }
.hero-note { font-size: 12px; color: var(--muted); margin: 0; }
.hero-chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 520px; }
.hero-chars a { display: block; text-decoration: none; }
.hero-chars a:nth-child(odd) svg { transform: rotate(-6deg); }
.hero-chars a:nth-child(even) svg { transform: rotate(5deg) translateY(8px); }
.hero-chars svg { display: block; width: 100%; height: auto; transition: transform .15s ease; }
.hero-chars a:hover svg { transform: scale(1.08); }
@media (min-width: 860px) {
  .hero .inner { grid-template-columns: 1.15fr 1fr; align-items: center; padding-top: 72px; padding-bottom: 80px; }
  .hero-chars { grid-row: 1 / span 5; grid-column: 2; }
}

/* ---- Steps ---- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 2px solid var(--line); }
.steps li { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; padding: 20px 0; border-bottom: 2px solid var(--line); }
.steps .no { grid-row: span 2; font-size: 44px; font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.steps b { font-size: 19px; font-weight: 900; line-height: 1.4; }
.steps p { margin: 0; color: var(--muted); font-size: 14px; }
@media (min-width: 860px) {
  .steps { grid-template-columns: repeat(3, 1fr); border-top: 0; border-left: 2px solid var(--line); }
  .steps li { grid-template-columns: 1fr; padding: 4px 24px 8px; border-bottom: 0; border-right: 2px solid var(--line); }
  .steps .no { grid-row: auto; margin-bottom: 8px; }
}

/* ---- Axes ---- */
.axes { display: grid; gap: 0; border-top: 2px solid var(--line); max-width: 720px; }
.axis-item { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 2px solid var(--line); }
.axis-item .ax-name { font-size: 28px; font-weight: 900; text-align: center; }
.axis-item .ax-sides { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.axis-item .side b { display: block; font-size: 17px; font-weight: 900; }
.axis-item .side small { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }
.axis-item .side.r { text-align: right; }
.axis-item .vs { font-weight: 900; font-size: 13px; color: var(--muted); }
.code-chip { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; margin-right: 4px; background: var(--text); color: var(--bg); font-size: .85em; vertical-align: .05em; }
.side.r .code-chip { margin: 0 0 0 4px; }

/* ---- Type tiles ---- */
.type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2px solid var(--line); border-left: 2px solid var(--line); }
@media (min-width: 860px) { .type-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.type-tile {
  --c: var(--brand);
  position: relative; display: block; text-decoration: none; padding: 14px 14px 18px;
  border-right: 2px solid var(--line); border-bottom: 2px solid var(--line);
  background: var(--bg); transition: background-color .15s ease;
}
.type-tile:hover { background: color-mix(in srgb, var(--c) 12%, var(--bg)); }
.type-tile::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: var(--c); }
.type-tile svg { width: 78%; height: auto; display: block; margin: 8px auto 6px; }
.type-tile .tc-code { font-size: 12px; font-weight: 900; color: var(--c); letter-spacing: .14em; }
.type-tile .tc-name { font-size: 20px; font-weight: 900; line-height: 1.3; }
.type-tile .tc-sum { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 4px; }


/* ---- Final CTA ---- */
.cta-band { background: var(--accent); color: var(--on-accent); text-align: center; padding: 64px 0; border-bottom: 2px solid var(--line); }
.cta-band h2 { font-size: clamp(26px, 7vw, 44px); font-weight: 900; line-height: 1.3; margin: 0 0 8px; }
.cta-band p { margin: 0 0 28px; font-weight: 700; }
.cta-band .btn { background: var(--bg); color: var(--text); }

/* ---- Footer ---- */
.site-foot { padding: 32px 0 40px; font-size: 12px; color: var(--muted); }
.site-foot .inner { display: grid; gap: 8px; }
.site-foot nav { display: flex; flex-wrap: wrap; gap: 4px 16px; font-weight: 700; color: var(--text); }
.site-foot nav a { text-decoration: none; }
.site-foot p { margin: 0; }

/* ---- Quiz ---- */
.quiz { padding: 28px 0 64px; min-height: calc(100vh - 56px); background: var(--bg-2); }
.progress-row { display: flex; align-items: center; gap: 12px; }
.progress { flex: 1; height: 12px; background: var(--bg); border: 2px solid var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); transition: width .25s ease; }
.progress-num { font-size: 15px; font-weight: 900; min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
.q-label { font-size: 56px; font-weight: 900; line-height: 1; color: var(--brand); margin: 32px 0 8px; font-variant-numeric: tabular-nums; }
.q-text { font-size: clamp(24px, 7vw, 34px); font-weight: 900; line-height: 1.4; margin: 0 0 28px; }
.choices { display: grid; gap: 14px; }
.choice {
  display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px;
  padding: 14px 18px; text-align: left; cursor: pointer;
  background: var(--bg); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line);
  font-size: 18px; font-weight: 800; line-height: 1.45;
  transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
}
.choice:hover { background: color-mix(in srgb, var(--brand-2) 22%, var(--bg)); }
.choice:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.choice .tag { flex: none; display: grid; place-items: center; width: 38px; height: 38px; background: var(--text); color: var(--bg); font-weight: 900; font-size: 17px; }
.choice.picked { background: var(--brand-2); color: #1C1A22; transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.choice.picked .tag { background: #1C1A22; color: #FFF; }
.back-link { margin-top: 24px; background: none; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; padding: 8px 0; text-decoration: underline; }
.back-link:disabled { visibility: hidden; }

/* ---- Result ---- */
.fade-in { animation: fadeIn .5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade-in, .toast { animation: none; }
  * { transition: none !important; scroll-behavior: auto !important; }
}

.r-hero { background: var(--accent); color: var(--on-accent); border-bottom: 2px solid var(--line); position: relative; overflow: hidden; }
.r-hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .14;
  background-image: repeating-linear-gradient(-45deg, currentColor 0 2px, transparent 2px 18px);
}
.r-hero .inner { position: relative; padding-top: 32px; padding-bottom: 40px; text-align: center; }
.r-eyebrow { display: inline-block; font-size: 13px; font-weight: 900; letter-spacing: .08em; background: var(--on-accent); color: var(--accent); padding: 4px 12px; margin: 0; }
.type-title { font-size: clamp(52px, 17vw, 104px); font-weight: 900; line-height: 1.1; margin: 12px 0 8px; letter-spacing: .02em; }
.code-badges { display: inline-flex; gap: 6px; }
.code-badges span { display: grid; place-items: center; width: 44px; height: 44px; background: var(--on-accent); color: var(--accent); font-weight: 900; font-size: 22px; }
.r-illust { width: min(240px, 62vw); margin: 20px auto 0; background: var(--bg); border: 2px solid var(--line); border-radius: 50%; padding: 8px; }
.r-illust svg { width: 100%; height: auto; display: block; }
.r-summary { margin: 16px auto 0; font-weight: 800; font-size: 16px; max-width: 26em; }

.r-sec { padding: 40px 0; border-bottom: 2px solid var(--line); }
.r-sec.alt { background: var(--tint); }
.r-h { font-size: 22px; font-weight: 900; line-height: 1.4; margin: 0 0 18px; }
.r-h .kicker { margin-bottom: 2px; }

.axis-row + .axis-row { margin-top: 18px; }
.axis-labels { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 8px; gap: 8px; }
.axis-labels .on { color: var(--accent); }
.axis-labels .off { color: var(--muted); font-weight: 600; }
.axis-track { position: relative; height: 14px; background: var(--bg); border: 2px solid var(--line); margin: 0 11px; }
.axis-track::after { content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--line); }
.axis-track i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 55%, transparent); }
.axis-track b { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--line); z-index: 1; }
.axis-ratio { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

.desc { margin: 0 0 24px; font-size: 16px; }
.why-box { border: 2px solid var(--line); background: var(--bg); padding: 18px 18px 20px; box-shadow: 6px 6px 0 var(--accent); }
.why-box p { margin: 0; font-size: 16px; font-weight: 700; }
.why-box .why-lead { font-size: 13px; font-weight: 900; color: var(--accent); margin-bottom: 8px; }

.genres { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
.genres li { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; padding: 18px 0; border-bottom: 2px solid var(--line); }

.event { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 16px 0; border-bottom: 2px solid var(--line); }

.event .price { font-weight: 900; font-size: 16px; text-align: right; white-space: nowrap; }
.event .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.dummy-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

.share-row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.share-row .btn { padding: 12px 8px; font-size: 15px; }
.share-row .btn.x { background: #0F0F0F; color: #FFFFFF; }
.copied { font-size: 13px; text-align: center; min-height: 1.5em; margin: 10px 0 0; font-weight: 800; }
.end-row { display: grid; gap: 14px; }
@media (min-width: 600px) { .end-row { grid-template-columns: 1fr 1fr; } }

.page-head { padding: 40px 0 28px; }
.page-head .sec-h { margin-bottom: 8px; }
.page-head p { color: var(--muted); margin: 0; }

/* ---- My page ---- */
.subnav { border-bottom: 2px solid var(--line); background: var(--bg-2); }
.subnav .inner { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 680px; }
.subnav a { text-align: center; padding: 12px 2px 10px; font-size: 13px; font-weight: 800; text-decoration: none; border-bottom: 4px solid transparent; white-space: nowrap; }
.subnav a.on { border-bottom-color: var(--text); }

.pcard { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; border: 2px solid var(--line); background: var(--bg); color: var(--text); padding: 16px; box-shadow: 6px 6px 0 var(--accent); }
.pcard-char svg { width: 100%; height: auto; display: block; }
.pcard-char.empty { aspect-ratio: 1; display: grid; place-items: center; font-size: 44px; font-weight: 900; border: 2px dashed var(--hair); color: var(--muted); }
.pcard-title { margin: 0; display: inline-block; font-size: 12px; font-weight: 900; background: var(--accent); color: var(--on-accent); padding: 2px 8px; }
.pcard-type { margin: 4px 0 8px; font-size: 20px; font-weight: 900; line-height: 1.3; }
.pcard-stats { display: flex; flex-wrap: wrap; gap: 0 18px; margin: 0; }
.pcard-stats dt { font-size: 11px; font-weight: 700; opacity: .7; }
.pcard-stats dd { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.3; font-variant-numeric: tabular-nums; }
.pcard-stickers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.pcard-stickers svg { width: 28px; height: 28px; }
.pcard.skin-stage { background: radial-gradient(ellipse at 30% -10%, rgba(255,255,255,.4), transparent 55%), #1C1A22; color: #FFFFFF; }
.pcard.skin-confetti {
  background-color: var(--bg);
  background-image: radial-gradient(#F2545B 2px, transparent 2.6px), radial-gradient(#3E63DD 2px, transparent 2.6px), radial-gradient(#FFC53D 2.5px, transparent 3px);
  background-size: 26px 26px, 34px 34px, 22px 22px; background-position: 0 0, 11px 15px, 5px 3px;
}
.field-row { display: grid; gap: 12px; margin-top: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field-row label { display: grid; gap: 4px; font-size: 12px; font-weight: 800; }
.field-row select { width: 100%; min-width: 0; font: inherit; font-size: 14px; padding: 10px; border: 2px solid var(--line); border-radius: 0; background: var(--bg); color: var(--text); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; font-weight: 800; padding: 4px 10px; border: 2px solid var(--line); background: var(--bg); }
.chip.lv1 { background: var(--brand-2); color: #1C1A22; }
.chip.lv3 { background: var(--text); color: var(--bg); }
.empty-note { color: var(--muted); font-size: 14px; margin: 0; }

.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2px solid var(--line); border-left: 2px solid var(--line); }
@media (min-width: 600px) { .badges { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.badge { padding: 14px; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.badge .medal { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); background: var(--hair); color: var(--muted); font-size: 18px; font-weight: 900; }
.badge.on .medal { background: var(--brand-2); color: #1C1A22; }
.badge b { display: block; font-size: 15px; line-height: 1.4; margin-top: 8px; }
.badge small { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); }
.badge .n { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }

.sticker-book { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px; }
.sticker-book figure { margin: 0; text-align: center; }
.sticker-book svg { width: 60px; height: 60px; }
.sticker-book figcaption { font-size: 11px; font-weight: 700; color: var(--muted); }

.ledger { list-style: none; margin: 0 0 16px; padding: 0; border-top: 2px solid var(--line); }
.ledger li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.ledger .p { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger .p.minus { color: var(--muted); }

.missions { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
.mission { padding: 16px 0; border-bottom: 2px solid var(--line); }
.mission .m-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mission b { font-size: 16px; line-height: 1.45; }
.mission.done b::before { content: "✓ "; }
.mission .m-reward { flex: none; font-size: 12px; font-weight: 900; background: var(--brand-2); color: #1C1A22; padding: 2px 8px; max-width: 45%; text-align: right; }
.mission small { display: block; font-size: 12px; color: var(--muted); }
.m-prog { height: 10px; border: 2px solid var(--line); background: var(--bg); margin: 8px 0 4px; }
.m-prog i { display: block; height: 100%; background: var(--brand); }
.mission.done .m-prog i { background: var(--text); }

.gbook { border-top: 2px solid var(--line); }
.grow { border-bottom: 2px solid var(--line); }
.grow summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; font-weight: 900; font-size: 16px; }
.grow summary::-webkit-details-marker { display: none; }
.gstat { flex: none; font-size: 12px; font-weight: 900; padding: 2px 8px; border: 2px solid var(--line); }
.gstat.st-none { color: var(--muted); border-color: var(--hair); }
.gstat.st-interest { background: var(--bg); }
.gstat.st-debut { background: var(--brand-2); color: #1C1A22; }
.gstat.st-master { background: var(--text); color: var(--bg); }
.gbody { padding: 0 0 16px; }
.gbody ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.gbody li b { color: var(--text); margin-right: 6px; }
.g-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.genres .g-actions { grid-column: 2; }
.act { min-height: 36px; padding: 6px 12px; font-size: 13px; font-weight: 800; border: 2px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
.act.on { background: var(--text); color: var(--bg); }
.act:disabled { cursor: default; }

.balance { font-size: 44px; font-weight: 900; line-height: 1.1; margin: 0; font-variant-numeric: tabular-nums; }
.balance small { font-size: 16px; margin-left: 4px; }
.shop { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
.shop-item { display: grid; grid-template-columns: 56px 1fr; gap: 8px 14px; align-items: center; padding: 14px 0; border-bottom: 2px solid var(--line); }
.si-art { width: 56px; height: 56px; display: grid; place-items: center; border: 2px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 900; overflow: hidden; }
.si-art svg { width: 50px; height: 50px; }
.si-art.skin-stage { background: radial-gradient(ellipse at 30% -10%, rgba(255,255,255,.45), transparent 60%), #1C1A22; }
.si-art.skin-confetti { background-image: radial-gradient(#F2545B 2px, transparent 2.6px), radial-gradient(#3E63DD 2px, transparent 2.6px), radial-gradient(#FFC53D 2.5px, transparent 3px); background-size: 14px 14px, 18px 18px, 11px 11px; background-position: 0 0, 6px 8px, 3px 2px; }
.si-body b { display: block; font-size: 15px; line-height: 1.4; }
.si-body small { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); }
.si-cost { font-size: 14px; font-weight: 900; }
.shop-item .btn { grid-column: 2; justify-self: start; }
.si-code { display: inline-block; margin-top: 4px; padding: 2px 8px; border: 2px dashed var(--line); font-family: ui-monospace, Consolas, monospace; font-size: 13px; font-weight: 800; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--line); }

.toasts { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 50; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { width: 100%; max-width: 420px; padding: 12px 16px; background: var(--text); color: var(--bg); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--brand-2); font-size: 14px; font-weight: 800; animation: toastIn .25s ease both; transition: opacity .3s ease; }
.toast.out { opacity: 0; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="site-head">
  <div class="inner">
    <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span>エンタメタイプ診断</a>
    <nav class="head-nav" aria-label="メニュー">
      <a class="txt hide-sm" href="#/types">8タイプ一覧</a>
      <a class="me-link" href="#/me"><span class="lbl">マイページ</span><span class="pts"><span data-pts>0</span>pt</span></a>
      <a class="btn small" href="#/quiz" data-start>診断する</a>
    </nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer class="site-foot">
  <div class="inner">
    <nav aria-label="フッター">
      <a href="#/">トップ</a><a href="#/quiz" data-start>診断をはじめる</a><a href="#/types">8タイプ一覧</a><a href="#/me">マイページ</a><a href="#/missions">ミッション</a><a href="#/genres">ジャンル図鑑</a><a href="#/shop">交換所</a>
    </nav>
    <p>個人情報は取得しません。マイページの記録はこの端末にだけ保存されます。公演情報・特典はサンプルです。</p>
  </div>
</footer>

<script>
(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const app = document.getElementById('app');
  const root = document.documentElement;
  const AXES = DATA.axes;
  const QUESTIONS = DATA.questions;
  const TYPES = DATA.types;
  const TYPE_ORDER = DATA.typeOrder && DATA.typeOrder.length ? DATA.typeOrder : Object.keys(TYPES);
  const GAME = DATA.game || {};
  const CATALOG = DATA.genreCatalog || [];
  const GENRE_CAT = {};
  CATALOG.forEach(c => c.genres.forEach(g => { GENRE_CAT[g] = c.category; }));

  // 回答はメモリ上だけに保持（保存・送信はしない）
  const state = { answers: [], index: 0, result: null, locked: false };

  validateData();

  // ---------- utils ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function axisById(id) { return AXES.find(a => a.id === id); }

  function sideOf(code) {
    for (const a of AXES) for (const s of a.sides) if (s.code === code) return { axis: a, side: s };
    return null;
  }

  // 背景色に対して読みやすい文字色（白 or 濃色）を返す
  function onColor(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    const L = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    return (1.05) / (L + 0.05) >= 3 ? '#FFFFFF' : '#1B1A1F';
  }

  function setTheme(color) {
    if (color) {
      root.style.setProperty('--accent', color);
      root.style.setProperty('--on-accent', onColor(color));
    } else {
      root.style.removeProperty('--accent');
      root.style.removeProperty('--on-accent');
    }
  }

  function resetQuiz() { state.answers = []; state.index = 0; state.result = null; }

  function validateData() {
    AXES.forEach(a => {
      const n = QUESTIONS.filter(q => q.axis === a.id).length;
      if (n % 2 === 0) console.warn('[診断データ] 軸「' + a.name + '」の質問数が偶数です（同点が起きる可能性があります）');
    });
    QUESTIONS.forEach((q, i) => {
      const a = axisById(q.axis);
      const codes = a ? a.sides.map(s => s.code) : [];
      if (!a || !codes.includes(q.a.value) || !codes.includes(q.b.value) || q.a.value === q.b.value) {
        console.warn('[診断データ] 質問' + (i + 1) + 'の axis / value が正しくありません');
      }
    });
    Object.keys(TYPES).forEach(code => TYPES[code].genres.forEach(g => {
      if (!GENRE_CAT[g.name]) console.warn('[診断データ] ' + code + ' の推薦ジャンル「' + g.name + '」が genreCatalog にありません');
    }));
  }

  // ロゴの色ドット（8タイプの色）
  document.querySelector('.logo-mark').innerHTML = TYPE_ORDER.map(c => `<i style="background:${esc(TYPES[c].color)}"></i>`).join('');

  // 「診断をはじめる」系のリンクは、どこから押しても回答をリセットする
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-start]')) return;
    resetQuiz();
    // すでに質問画面にいる場合は hashchange が起きないので、ここで描き直す
    if (location.hash === '#/quiz') { e.preventDefault(); route(); }
  });

  // ---------- illustration ----------
  const INK = '#2B2733';
  const ACCESSORIES = {
    'hands-up': c => ({
      back: `<path d="M48 120 L22 62" stroke="${c}" stroke-width="14" stroke-linecap="round"/>
             <path d="M152 120 L178 62" stroke="${c}" stroke-width="14" stroke-linecap="round"/>
             <circle cx="22" cy="58" r="10" fill="${c}"/><circle cx="178" cy="58" r="10" fill="${c}"/>
             <path d="M8 40l8 6M30 30l-2 10M192 40l-8 6M170 30l2 10" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`,
      mouth: `<path d="M86 132 Q100 156 114 132 Z" fill="${INK}"/><path d="M93 142 Q100 150 107 142" fill="#F37C8E"/>`
    }),
    'bubble': c => ({
      front: `<g transform="translate(122 20)"><path d="M6 0h56a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12H26l-14 12 2-12H6A12 12 0 0 1-6 34V12A12 12 0 0 1 6 0z" fill="#fff" stroke="${INK}" stroke-width="4"/>
              <circle cx="18" cy="23" r="5" fill="${c}"/><circle cx="34" cy="23" r="5" fill="${c}"/><circle cx="50" cy="23" r="5" fill="${c}"/></g>`
    }),
    'penlight': c => ({
      front: `<path d="M150 138 L174 70" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
              <path d="M174 70 L186 34" stroke="${c}" stroke-width="12" stroke-linecap="round"/>
              <path d="M174 70 L186 34" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
              <circle cx="150" cy="138" r="11" fill="${c}" stroke="${INK}" stroke-width="3"/>
              <path d="M30 48c0-7 10-9 12-2 2-7 12-5 12 2 0 8-12 14-12 14s-12-6-12-14z" fill="${c}"/>`
    }),
    'stamp': c => ({
      front: `<g transform="translate(118 116) rotate(-8)"><rect x="0" y="0" width="70" height="46" rx="8" fill="#fff" stroke="${INK}" stroke-width="4"/>
              <circle cx="16" cy="16" r="7" fill="${c}"/><circle cx="35" cy="16" r="7" fill="${c}"/><circle cx="54" cy="16" r="7" fill="${c}"/>
              <circle cx="16" cy="32" r="7" fill="${c}"/><circle cx="35" cy="32" r="7" fill="none" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="54" cy="32" r="7" fill="none" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3"/></g>`
    }),
    'headphones': c => ({
      front: `<path d="M44 104 C44 40 156 40 156 104" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
              <rect x="30" y="94" width="24" height="40" rx="11" fill="${INK}"/><rect x="146" y="94" width="24" height="40" rx="11" fill="${INK}"/>
              <path d="M172 40v-18l14-4v18" fill="none" stroke="${c}" stroke-width="4"/><circle cx="168" cy="40" r="5" fill="${c}"/><circle cx="182" cy="36" r="5" fill="${c}"/>`,
      eyes: `<path d="M74 110 Q82 118 90 110" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>
             <path d="M110 110 Q118 118 126 110" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`
    }),
    'glasses': c => ({
      eyes: `<circle cx="82" cy="108" r="5" fill="${INK}"/><circle cx="118" cy="108" r="5" fill="${INK}"/>
             <circle cx="82" cy="108" r="15" fill="#fff" fill-opacity=".25" stroke="${INK}" stroke-width="4"/>
             <circle cx="118" cy="108" r="15" fill="#fff" fill-opacity=".25" stroke="${INK}" stroke-width="4"/>
             <path d="M97 106h6" stroke="${INK}" stroke-width="4"/>`,
      front: `<text x="160" y="56" font-size="40" font-weight="900" fill="${c}" font-family="system-ui, sans-serif">?</text>
              <circle cx="38" cy="44" r="5" fill="${c}"/><circle cx="26" cy="62" r="3" fill="${c}"/>`
    }),
    'flag': c => ({
      back: `<path d="M150 150 L166 30" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
             <path d="M166 32 L196 44 L163 58 Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`,
      front: `<circle cx="150" cy="150" r="11" fill="${c}" stroke="${INK}" stroke-width="3"/>
              <path d="M26 54l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="${c}"/>`
    }),
    'magnifier': c => ({
      front: `<path d="M150 150 L176 176" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>
              <circle cx="138" cy="138" r="22" fill="#fff" fill-opacity=".5" stroke="${INK}" stroke-width="7"/>
              <path d="M30 40l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="${c}"/>
              <path d="M170 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="${c}"/>`
    })
  };

  function charSVG(code, opts) {
    const t = TYPES[code];
    const c = t.color;
    const o = opts || {};
    const acc = (ACCESSORIES[t.illust] || (() => ({})))(c);
    const eyes = acc.eyes || `<circle cx="82" cy="108" r="6" fill="${INK}"/><circle cx="118" cy="108" r="6" fill="${INK}"/>
      <circle cx="84" cy="106" r="2" fill="#fff"/><circle cx="120" cy="106" r="2" fill="#fff"/>`;
    const mouth = acc.mouth || `<path d="M90 130 Q100 140 110 130" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    const halo = o.noHalo ? '' : `<circle cx="100" cy="104" r="92" fill="${c}" fill-opacity=".14"/>`;
    return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(t.name + 'のキャラクター')}" xmlns="http://www.w3.org/2000/svg">
      ${halo}
      ${acc.back || ''}
      <ellipse cx="100" cy="182" rx="48" ry="7" fill="${INK}" opacity=".12"/>
      <path d="M100 46c38 0 60 32 60 72 0 38-26 60-60 60s-60-22-60-60c0-40 22-72 60-72z" fill="${c}"/>
      <ellipse cx="80" cy="72" rx="15" ry="9" fill="#fff" opacity=".28" transform="rotate(-20 80 72)"/>
      <circle cx="68" cy="126" r="8" fill="#FF8FA3" opacity=".55"/><circle cx="132" cy="126" r="8" fill="#FF8FA3" opacity=".55"/>
      ${eyes}${mouth}
      ${acc.front || ''}
    </svg>`;
  }

  // ---------- scoring ----------
  function computeResult(answers) {
    const counts = {};
    AXES.forEach(a => a.sides.forEach(s => { counts[s.code] = 0; }));
    answers.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
    const axes = AXES.map(a => {
      const [s0, s1] = a.sides;
      const n0 = counts[s0.code], n1 = counts[s1.code];
      const win = n0 >= n1 ? s0 : s1;
      return { axis: a, win: win, counts: [n0, n1] };
    });
    return { code: axes.map(x => x.win.code).join(''), axes: axes };
  }

  // ---------- parts ----------
  function typeGrid() {
    return `<div class="type-grid">
      ${TYPE_ORDER.map(code => {
        const t = TYPES[code];
        return `<a class="type-tile" href="#/types/${esc(code)}" style="--c:${esc(t.color)}">
          ${charSVG(code)}
          <div class="tc-code">${esc(code)}</div>
          <div class="tc-name">${esc(t.name)}</div>
          <div class="tc-sum">${esc(t.summary)}</div>
        </a>`;
      }).join('')}
    </div>`;
  }

  function ctaBand() {
    return `<section class="cta-band">
      <div class="inner narrow">
        <h2>次のエンタメ、<br>楽しみ方で選ぼう。</h2>
        <p>${esc(DATA.meta.duration)}</p>
        <a class="btn" href="#/quiz" data-start>診断をはじめる</a>
      </div>
    </section>`;
  }

  // ---------- views ----------
  function viewTop() {
    setTheme(null);
    const m = DATA.meta;
    app.innerHTML = `
      <section class="hero fade-in">
        <div class="inner">
          <span class="hero-badge"><b>${esc(m.duration)}</b>で診断</span>
          <h1>その「好き」、<br><span class="mark">別のジャンル</span>でも<br><span class="red">楽しめる。</span></h1>

  function viewQuiz() {
    setTheme(null);
    if (state.index >= QUESTIONS.length) state.index = 0;
    const i = state.index;
    const q = QUESTIONS[i];
    const total = QUESTIONS.length;
    const picked = state.answers[i];
    app.innerHTML = `
      <section class="quiz">
        <div class="inner narrow fade-in" style="animation-duration:.25s">
          <div class="progress-row">
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${i}" aria-label="進捗"><i style="width:${(i / total) * 100}%"></i></div>
            <span class="progress-num">${i + 1} / ${total}</span>
          </div>
          <p class="q-label">Q${i + 1}</p>
          <h1 class="q-text">${esc(q.text)}</h1>
          <div class="choices">
            ${['a', 'b'].map(k => `
              <button type="button" class="choice${picked === q[k].value ? ' picked' : ''}" data-value="${esc(q[k].value)}">
                <span class="tag">${k.toUpperCase()}</span><span>${esc(q[k].text)}</span>
              </button>`).join('')}
          </div>
          <button type="button" class="back-link" data-back ${i === 0 ? 'disabled' : ''}>← 前の質問に戻る</button>
        </div>
      </section>`;
    state.locked = false;

    app.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.locked) return;
        state.locked = true;
        app.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        state.answers[i] = btn.dataset.value;
        app.querySelector('.progress > i').style.width = ((i + 1) / total) * 100 + '%';
        setTimeout(() => {
          if (i + 1 < total) {
            state.index = i + 1;
            viewQuiz();
          } else if (isComplete()) {
            state.result = computeResult(state.answers);
            location.hash = '#/result';
          } else {
            // 未回答が残っていれば最初の未回答へ
            state.index = firstUnanswered();
            viewQuiz();
          }
        }, 220);
      });
    });
    app.querySelector('[data-back]').addEventListener('click', () => {
      if (state.index > 0) { state.index -= 1; viewQuiz(); }
    });
  }

  function isComplete() {
    if (state.answers.length !== QUESTIONS.length) return false;
    return QUESTIONS.every((q, i) => state.answers[i] === q.a.value || state.answers[i] === q.b.value);
  }
  function firstUnanswered() {
    for (let i = 0; i < QUESTIONS.length; i++) if (!state.answers[i]) return i;
    return 0;
  }

  function axisBlock(result, code) {
    // result がある場合は比率、ない場合（タイプ詳細）はどちら側かだけを表示
    return AXES.map((a, idx) => {
      const [s0, s1] = a.sides;
      let n0, n1, winCode;
      if (result) {
        const r = result.axes[idx];
        n0 = r.counts[0]; n1 = r.counts[1]; winCode = r.win.code;
      } else {
        winCode = code[idx];
        n0 = winCode === s0.code ? 3 : 0; n1 = 3 - n0;
      }
      // 中央を0として、多い側へ差の分だけ寄せる（3:0なら端、2:1なら1/3ほど）
      const total = n0 + n1 || 1;
      const pos = 50 - ((n0 - n1) / total) * 50;
      const from = Math.min(pos, 50), width = Math.abs(pos - 50);
      return `<div class="axis-row">
        <div class="axis-labels">
          <span class="${winCode === s0.code ? 'on' : 'off'}">${esc(s0.code)} ${esc(s0.label)}</span>
          <span class="${winCode === s1.code ? 'on' : 'off'}">${esc(s1.label)} ${esc(s1.code)}</span>
        </div>
        <div class="axis-track" aria-hidden="true"><i style="left:${from}%;width:${width}%"></i><b style="left:${pos}%"></b></div>
        <div class="axis-ratio">${result ? `${esc(a.name)}：${esc(s0.label)} ${n0} : ${n1} ${esc(s1.label)}` : `${esc(a.name)}：${esc(sideOf(winCode).side.desc)}`}</div>
      </div>`;
    }).join('');
  }

  function viewResult() {

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // ---------- my page: progress (saved only in this browser) ----------
  const STORE_KEY = GAME.storageKey || 'entame-type-mypage';

  function blankProfile() {
    return {
      v: 1, type: null, events: [], genres: {}, earned: [], spent: [],
      owned: { stickers: [], skins: [], titles: [], perks: {} },
      done: { missions: [], achievements: [] },
      equip: { title: '', skin: '' }
    };
  }
  function loadProfile() {
    const base = blankProfile();
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return base;
      const p = JSON.parse(raw);
      return Object.assign(base, p, {
        owned: Object.assign(base.owned, p.owned),
        done: Object.assign(base.done, p.done),
        equip: Object.assign(base.equip, p.equip)
      });
    } catch (e) {
      return base;
    }
  }
  let profile = loadProfile();
  function saveProfile() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(profile)); } catch (e) { /* 保存できない環境ではこのページを開いている間だけ有効 */ }
  }

  const sumPts = list => list.reduce((n, x) => n + x.pts, 0);
  const balance = () => sumPts(profile.earned) - sumPts(profile.spent);
  const dayKey = ts => new Date(ts).toDateString();
  const findSticker = id => (GAME.stickers || []).find(s => s.id === id);
  const skinName = id => ((GAME.skins || []).find(s => s.id === id) || { name: id }).name;

  function genreState(g) {
    if (!profile.genres[g]) profile.genres[g] = { interest: false, viewed: false, exp: 0, introduced: false };
    return profile.genres[g];
  }

  // イベント種別 → ポイントルール
  const RULE_OF = { diagnose: 'diagnose', view: 'view', interest: 'interest', experience: 'experience', share: 'share', shareProfile: 'share', introduce: 'introduce' };

  function awardRule(type, g) {
    const key = RULE_OF[type];
    const rule = (GAME.pointRules || {})[key];
    if (!rule || !rule.points) return null;
    const now = Date.now();
    const already = profile.earned.some(x => x.k === key && (
      rule.limit === 'once' ||
      (rule.limit === 'perGenre' && x.g === (g || '')) ||
      (rule.limit === 'daily' && dayKey(x.ts) === dayKey(now))));
    if (rule.limit && rule.limit !== 'none' && already) return null;
    const label = rule.label + (g ? '：' + g : '');
    profile.earned.push({ k: key, g: g || '', pts: rule.points, label: label, ts: now });
    return '+' + rule.points + 'pt ' + label;
  }

  function track(type, g) {
    if (g) {
      const st = genreState(g);
      // 体験済みのジャンルは「未開拓のチェック」に数えない
      if (type === 'view') { if (st.viewed || st.exp > 0) return; st.viewed = true; }
      if (type === 'interest') { if (st.interest) return; st.interest = true; }
      if (type === 'experience') st.exp += 1;
      if (type === 'introduce') st.introduced = true;
    }
    const ev = { t: type, ts: Date.now() };
    if (g) { ev.g = g; ev.c = GENRE_CAT[g] || ''; }
    profile.events.push(ev);
    const messages = [];
    const m = awardRule(type, g);
    if (m) messages.push(m);
    checkProgress(messages);
    saveProfile();
    messages.forEach(toast);
    updateHeader();
  }

  function inPeriod(m, ts) {
    if (m.from && ts < new Date(m.from + 'T00:00:00').getTime()) return false;
    if (m.to && ts > new Date(m.to + 'T23:59:59').getTime()) return false;
    return true;
  }
  function activeMissions() {
    const now = Date.now();
    return (GAME.missions || []).filter(m => inPeriod(m, now));
  }
  function missionProgress(m) {
    const goal = m.goal;
    const evs = profile.events.filter(e =>
      (e.t === goal.type || (goal.type === 'share' && e.t === 'shareProfile')) &&
      inPeriod(m, e.ts) &&
      (!goal.categories || goal.categories.includes(e.c)) &&
      (!goal.genres || goal.genres.includes(e.g)));
    const n = goal.unique ? new Set(evs.map(e => e.g)).size : evs.length;
    return Math.min(n, goal.count);
  }
  function achievementProgress(a) {
    const c = a.cond;
    const gs = Object.keys(profile.genres).map(g => [g, profile.genres[g]]);
    let n;
    switch (c.type) {
      case 'experiencedGenres': n = gs.filter(([, s]) => s.exp > 0).length; break;
      case 'experiencedCategories': n = new Set(gs.filter(([, s]) => s.exp > 0).map(([g]) => GENRE_CAT[g])).size; break;
      case 'viewedGenres': n = gs.filter(([, s]) => s.viewed).length; break;
      case 'interestedGenres': n = gs.filter(([, s]) => s.interest).length; break;
      case 'introducedGenres': n = gs.filter(([, s]) => s.introduced).length; break;
      default: n = profile.events.filter(e => e.t === c.type).length;
    }
    return Math.min(n, c.count);
  }

  function rewardText(r) {
    const parts = [];
    if (r.points) parts.push('+' + r.points + 'pt');
    if (r.sticker) parts.push('ステッカー「' + (findSticker(r.sticker) || { name: r.sticker }).name + '」');
    if (r.title) parts.push('称号「' + r.title + '」');
    if (r.skin) parts.push('着せ替え「' + skinName(r.skin) + '」');
    return parts.join(' ');
  }
  function grant(reward, label, messages) {
    if (!reward) return;
    if (reward.points) profile.earned.push({ k: 'bonus', g: '', pts: reward.points, label: label, ts: Date.now() });
    if (reward.sticker && !profile.owned.stickers.includes(reward.sticker)) profile.owned.stickers.push(reward.sticker);
    if (reward.title && !profile.owned.titles.includes(reward.title)) profile.owned.titles.push(reward.title);
    if (reward.skin && !profile.owned.skins.includes(reward.skin)) profile.owned.skins.push(reward.skin);
    messages.push(label + '　' + rewardText(reward));
  }
  function checkProgress(messages) {
    activeMissions().forEach(m => {
      if (profile.done.missions.includes(m.id) || missionProgress(m) < m.goal.count) return;
      profile.done.missions.push(m.id);
      grant(m.reward, 'ミッション達成「' + m.title + '」', messages);
    });
    (GAME.achievements || []).forEach(a => {
      if (profile.done.achievements.includes(a.id) || achievementProgress(a) < a.cond.count) return;
      profile.done.achievements.push(a.id);
      grant(a.reward, '実績解除「' + a.title + '」', messages);
    });
  }

  // 開拓タイプ：ジャンルごとに、いちばん上の段階の称号を1つ
  function exploreTitles() {
    const out = [];
    Object.keys(profile.genres).forEach(g => {
      const s = profile.genres[g];
      const rule = (GAME.exploreTitles || []).find(r =>
        r.when === 'experience' ? s.exp >= (r.count || 1) : (r.when === 'interest' && s.interest));
      if (rule) out.push({ label: rule.label.replace('{genre}', g), level: rule.when === 'experience' ? (rule.count || 1) : 0 });
    });
    return out.sort((a, b) => b.level - a.level);
  }
  function ownedTitles() { return exploreTitles().map(t => t.label).concat(profile.owned.titles); }
  function currentTitle() {
    const all = ownedTitles();
    return all.includes(profile.equip.title) ? profile.equip.title : (all[0] || '');
  }
  function genreStatus(g) {
    const s = profile.genres[g] || {};
    if (s.exp >= 3) return { key: 'master', label: '通 ×' + s.exp };
    if (s.exp >= 1) return { key: 'debut', label: 'デビュー済み' };
    if (s.interest) return { key: 'interest', label: '開拓中' };
    return { key: 'none', label: '未開拓' };
  }

  // ---------- my page: UI parts ----------
  const toastBox = document.createElement('div');
  toastBox.className = 'toasts';
  toastBox.setAttribute('role', 'status');
  document.body.appendChild(toastBox);
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    toastBox.appendChild(el);
    while (toastBox.children.length > 3) toastBox.firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
  }

  function updateHeader() {
    document.querySelectorAll('[data-pts]').forEach(el => { el.textContent = balance(); });
  }

  const STICKER_ART = {
    star: c => '<path d="M32 12l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z" fill="#fff"/>',
    sparkle: c => '<path d="M32 11l5 16 16 5-16 5-5 16-5-16-16-5 16-5z" fill="#fff"/>',
    ticket: c => `<path d="M13 22h38v6a4 4 0 0 0 0 8v6H13v-6a4 4 0 0 0 0-8z" fill="#fff"/><path d="M39 23v18" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3"/>`,
    megaphone: c => '<path d="M15 27h8l19-10v30l-19-10h-8z" fill="#fff"/><path d="M23 37l3 10h6l-3-10" fill="#fff"/><path d="M47 26q4 6 0 12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>',
    mic: c => '<rect x="26" y="11" width="12" height="22" rx="6" fill="#fff"/><path d="M20 29a12 12 0 0 0 24 0" stroke="#fff" stroke-width="3" fill="none"/><path d="M32 41v8M25 50h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>',
    leaf: c => `<path d="M17 47C17 27 31 16 48 16c0 19-12 31-31 31z" fill="#fff"/><path d="M17 47L37 27" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`,
    mask: c => `<path d="M13 23q19-9 38 0q0 19-19 24q-19-5-19-24z" fill="#fff"/><ellipse cx="25" cy="30" rx="4.5" ry="3" fill="${c}"/><ellipse cx="39" cy="30" rx="4.5" ry="3" fill="${c}"/><path d="M26 38q6 4 12 0" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    note: c => '<path d="M26 44V18l18-4v26" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round"/><circle cx="21" cy="44" r="6" fill="#fff"/><circle cx="39" cy="40" r="6" fill="#fff"/>',
    ball: c => `<circle cx="32" cy="32" r="15" fill="#fff"/><path d="M21 22q9 10 0 20M43 22q-9 10 0 20" stroke="${c}" stroke-width="2.5" fill="none"/>`
  };
  function stickerSVG(id, locked) {
    const st = findSticker(id) || { id: id, name: id, color: '#888888' };
    const col = locked ? '#C9C2B8' : st.color;
    const art = locked
      ? '<text x="32" y="42" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" font-family="system-ui, sans-serif">?</text>'
      : (STICKER_ART[id] ? STICKER_ART[id](col) : `<text x="32" y="41" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" font-family="system-ui, sans-serif">${esc(st.name.charAt(0))}</text>`);
    return `<svg viewBox="0 0 64 64" role="img" aria-label="${esc(locked ? '未入手' : st.name)}" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="29" fill="${col}" stroke="#1C1A22" stroke-width="3"/>${art}</svg>`;
  }

  function genreActions(g, withIntro) {
    return `<div class="g-actions">
      <button type="button" class="act" data-act="interest" data-g="${esc(g)}">＋ 気になる</button>
      <button type="button" class="act" data-act="experience" data-g="${esc(g)}">体験した</button>
      ${withIntro ? `<button type="button" class="act" data-act="introduce" data-g="${esc(g)}">友達に勧める</button>` : ''}
    </div>`;
  }
  function refreshGenreUI() {
    app.querySelectorAll('[data-act]').forEach(b => {
      const s = profile.genres[b.dataset.g] || {};
      if (b.dataset.act === 'interest') { b.textContent = s.interest ? '✓ 気になる' : '＋ 気になる'; b.classList.toggle('on', !!s.interest); b.disabled = !!s.interest; }
      if (b.dataset.act === 'experience') { b.textContent = s.exp ? '✓ 体験した（' + s.exp + '回）' : '体験した'; b.classList.toggle('on', !!s.exp); }
      if (b.dataset.act === 'introduce') b.classList.toggle('on', !!s.introduced);
    });
    app.querySelectorAll('[data-g-status]').forEach(el => {
      const st = genreStatus(el.dataset.gStatus);
      el.textContent = st.label;
      el.className = 'gstat st-' + st.key;
    });
  }

  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const g = b.dataset.g;
    if (b.dataset.act === 'introduce') {
      const text = `「${g}」おすすめだよ。いっしょに行ってみない？\n#${DATA.meta.hashtag}`;
      copyText(text).then(ok => {
        if (!ok) { toast('コピーできませんでした'); return; }
        toast('紹介文をコピーしました');
        track('introduce', g);
        refreshGenreUI();
      });
      return;
    }
    track(b.dataset.act, g);
    refreshGenreUI();
  });

  function subNav(active) {
    const tabs = [['me', 'マイページ'], ['missions', 'ミッション'], ['genres', 'ジャンル図鑑'], ['shop', '交換所']];
    return `<nav class="subnav" aria-label="マイページメニュー"><div class="inner">${tabs.map(([k, l]) =>
      `<a href="#/${k}"${k === active ? ' class="on" aria-current="page"' : ''}>${l}</a>`).join('')}</div></nav>`;
  }

  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // ---------- my page: views ----------
  function profileText() {
    const t = profile.type && TYPES[profile.type];
    const exp = Object.keys(profile.genres).filter(g => profile.genres[g].exp > 0).length;
    const title = currentTitle();
    return `私のエンタメプロフィール\n${t ? profile.type + ' ' + t.name : 'タイプ未診断'}${title ? '／' + title : ''}\n体験ジャンル ${exp}・実績 ${profile.done.achievements.length}`;
  }

  function viewMe() {
    const t = profile.type && TYPES[profile.type];
    setTheme(t ? t.color : null);
    const titles = ownedTitles();
    const cur = currentTitle();
    const skin = profile.owned.skins.includes(profile.equip.skin) ? profile.equip.skin : '';
    const exp = Object.keys(profile.genres).filter(g => profile.genres[g].exp > 0).length;
    const explore = exploreTitles();
    const tag = DATA.meta.hashtag;
    const pageUrl = /^https?:/.test(location.protocol) ? location.href.split('#')[0] : '';
    const intent = 'https://x.com/intent/tweet?text=' + encodeURIComponent(profileText()) + '&hashtags=' + encodeURIComponent(tag) + (pageUrl ? '&url=' + encodeURIComponent(pageUrl) : '');
    const history = profile.earned.map(x => Object.assign({ sign: 1 }, x)).concat(profile.spent.map(x => Object.assign({ sign: -1 }, x)))
      .sort((a, b) => b.ts - a.ts).slice(0, 10);

    app.innerHTML = `${subNav('me')}
      <div class="fade-in" data-page="me">
        <section class="r-sec">
          <div class="inner narrow">
            <div class="pcard${skin ? ' skin-' + esc(skin) : ''}">
              ${t ? `<div class="pcard-char">${charSVG(profile.type, { noHalo: true })}</div>` : '<div class="pcard-char empty">?</div>'}
              <div>
                <p class="pcard-title">${cur ? esc(cur) : '称号なし'}</p>
                <p class="pcard-type">${t ? esc(profile.type + ' ' + t.name) : 'タイプ未診断'}</p>
                <dl class="pcard-stats">
                  <div><dt>ポイント</dt><dd>${balance()}</dd></div>
                  <div><dt>体験ジャンル</dt><dd>${exp}</dd></div>
                  <div><dt>実績</dt><dd>${profile.done.achievements.length}</dd></div>
                </dl>
                ${profile.owned.stickers.length ? `<div class="pcard-stickers">${profile.owned.stickers.map(id => stickerSVG(id)).join('')}</div>` : ''}
              </div>
            </div>
            ${t ? '' : '<a class="btn block" href="#/quiz" data-start style="margin-top:24px">診断してタイプを登録</a>'}
            <div class="share-row" style="margin-top:24px">
              <button type="button" class="btn ghost no-arrow" data-share-profile>プロフィールをコピー</button>
              <a class="btn x no-arrow" data-share-profile-x href="${esc(intent)}" target="_blank" rel="noopener noreferrer">𝕏 でシェア</a>
            </div>
            <p class="copied" data-copied role="status"></p>
            <div class="field-row">
              <label>称号
                <select data-equip="title">${titles.length ? titles.map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('') : '<option value="">まだありません</option>'}</select>
              </label>
              <label>着せ替え
                <select data-equip="skin"><option value="">なし</option>${profile.owned.skins.map(id => `<option value="${esc(id)}"${id === skin ? ' selected' : ''}>${esc(skinName(id))}</option>`).join('')}</select>
              </label>
            </div>
          </div>
        </section>

        <section class="r-sec alt">
          <div class="inner narrow">
            <h2 class="r-h"><span class="kicker">EXPLORE</span>開拓タイプ</h2>
            ${explore.length
              ? `<div class="chips">${explore.map(x => `<span class="chip${x.level >= 3 ? ' lv3' : x.level >= 1 ? ' lv1' : ''}">${esc(x.label)}</span>`).join('')}</div>`
              : '<p class="empty-note">ジャンル図鑑の「気になる」「体験した」で増えていきます。</p>'}
          </div>
        </section>

        <section class="r-sec">
          <div class="inner narrow">
            <h2 class="r-h"><span class="kicker">BADGES</span>体験実績</h2>
            <div class="badges">
              ${(GAME.achievements || []).map(a => {
                const on = profile.done.achievements.includes(a.id);
                return `<div class="badge${on ? ' on' : ''}">
                  <span class="medal">${on ? '★' : '?'}</span>
                  <b>${esc(a.title)}</b>
                  <small>${esc(a.desc)}</small>
                  <span class="n">${achievementProgress(a)} / ${a.cond.count}</span>
                </div>`;
              }).join('')}
            </div>
          </div>
        </section>

        <section class="r-sec alt">
          <div class="inner narrow">
            <h2 class="r-h"><span class="kicker">STICKERS</span>ステッカー帳</h2>
            <div class="sticker-book">
              ${(GAME.stickers || []).map(st => {
                const own = profile.owned.stickers.includes(st.id);
                return `<figure>${stickerSVG(st.id, !own)}<figcaption>${own ? esc(st.name) : '？？？'}</figcaption></figure>`;
              }).join('')}
            </div>
          </div>
        </section>

        <section class="r-sec">
          <div class="inner narrow">
            <h2 class="r-h"><span class="kicker">HISTORY</span>ポイント履歴</h2>
            ${history.length
              ? `<ul class="ledger">${history.map(x => `<li><span>${esc(x.label)}</span><span class="p${x.sign < 0 ? ' minus' : ''}">${x.sign < 0 ? '−' : '+'}${x.pts}pt</span></li>`).join('')}</ul>`
              : '<p class="empty-note">まだありません。</p>'}
            <button type="button" class="back-link" data-reset>記録をリセット</button>
          </div>
        </section>
      </div>`;

    app.querySelector('[data-share-profile]').addEventListener('click', () => {
      copyText(profileText() + '\n#' + tag + (pageUrl ? '\n' + pageUrl : '')).then(ok => {
        app.querySelector('[data-copied]').textContent = ok ? 'コピーしました！' : 'コピーできませんでした';
        if (ok) { track('shareProfile'); refreshMeStats(); }
      });
    });
    app.querySelector('[data-share-profile-x]').addEventListener('click', () => { track('shareProfile'); refreshMeStats(); });
    app.querySelectorAll('[data-equip]').forEach(sel => sel.addEventListener('change', () => {
      profile.equip[sel.dataset.equip] = sel.value;
      saveProfile();
      viewMe();
    }));
    app.querySelector('[data-reset]').addEventListener('click', () => {
      if (!confirm('ポイント・実績・ステッカーなど、この端末の記録をすべて消します。よろしいですか？')) return;
      profile = blankProfile();
      saveProfile();
      updateHeader();
      viewMe();
    });
  }
  // シェアでポイントが入ったら、カードの数字だけ描き直す（コピー完了の表示は残す）
  function refreshMeStats() {
    const msg = app.querySelector('[data-copied]');
    const keep = msg ? msg.textContent : '';
    viewMe();
    const m2 = app.querySelector('[data-copied]');
    if (m2) m2.textContent = keep;
  }

  function viewMissions() {
    setTheme(null);
    const kinds = GAME.missionKinds || {};
    const active = activeMissions();
    const limitText = { once: '初回のみ', perGenre: 'ジャンルごと', daily: '1日1回', none: '毎回' };
    app.innerHTML = `${subNav('missions')}
      <div class="fade-in" data-page="missions">
        <section class="r-sec">
          <div class="inner narrow">
            <p class="balance">${balance()}<small>pt</small></p>
          </div>
        </section>
        ${Object.keys(kinds).map((kind, i) => {
          const list = active.filter(m => m.kind === kind);
          if (!list.length) return '';
          return `<section class="r-sec${i % 2 ? '' : ' alt'}">
            <div class="inner narrow">
              <h2 class="r-h"><span class="kicker">${esc(kind.toUpperCase())}</span>${esc(kinds[kind])}</h2>
              <ul class="missions">
                ${list.map(m => {
                  const n = missionProgress(m);
                  const done = profile.done.missions.includes(m.id);
                  return `<li class="mission${done ? ' done' : ''}">
                    <div class="m-top"><b>${esc(m.title)}</b><span class="m-reward">${esc(rewardText(m.reward))}</span></div>
                    ${m.partner ? `<small>${esc(m.partner)}</small>` : ''}
                    ${m.desc ? `<small>${esc(m.desc)}</small>` : ''}
                    <div class="m-prog"><i style="width:${(n / m.goal.count) * 100}%"></i></div>
                    <small>${n} / ${m.goal.count}${m.to ? '　〜' + fmtDate(m.to) : ''}${done ? '　達成' : ''}</small>
                  </li>`;
                }).join('')}
              </ul>
            </div>
          </section>`;
        }).join('')}
        <section class="r-sec">
          <div class="inner narrow">
            <h2 class="r-h"><span class="kicker">POINTS</span>ポイントのため方</h2>
            <ul class="ledger">
              ${Object.keys(GAME.pointRules || {}).map(k => {
                const r = GAME.pointRules[k];
                return `<li><span>${esc(r.label)}<small style="color:var(--muted)">（${esc(limitText[r.limit] || '毎回')}）</small></span><span class="p">+${r.points}pt</span></li>`;
              }).join('')}
              <li><span>ミッション・実績の達成</span><span class="p">ボーナス</span></li>
            </ul>
          </div>
        </section>
      </div>`;
  }

  function viewGenres() {
    setTheme(null);
    // ジャンルごとに、推薦しているタイプと理由を集める
    const fits = {};
    TYPE_ORDER.forEach(code => TYPES[code].genres.forEach(g => {
      (fits[g.name] = fits[g.name] || []).push({ code: code, why: g.why });
    }));
    app.innerHTML = `${subNav('genres')}
      <div class="fade-in" data-page="genres">
        ${CATALOG.map((c, i) => `<section class="r-sec${i % 2 ? ' alt' : ''}">
          <div class="inner narrow">
            <h2 class="r-h">${esc(c.category)}</h2>
            <div class="gbook">
              ${c.genres.map(g => `<details class="grow" data-genre="${esc(g)}">
                <summary><span>${esc(g)}</span><span data-g-status="${esc(g)}"></span></summary>
                <div class="gbody">
                  ${fits[g] ? `<ul>${fits[g].map(f => `<li><b>${esc(TYPES[f.code].name)}</b>${esc(f.why)}</li>`).join('')}</ul>` : ''}
                  ${genreActions(g, true)}
                </div>
              </details>`).join('')}
            </div>
          </div>
        </section>`).join('')}
      </div>`;
    app.querySelectorAll('details[data-genre]').forEach(d => d.addEventListener('toggle', () => {
      if (!d.open) return;
      track('view', d.dataset.genre);
      refreshGenreUI();
    }));
    refreshGenreUI();
  }

  function shopOwned(item) {
    if (item.kind === 'sticker') return profile.owned.stickers.includes(item.sticker);
    if (item.kind === 'skin') return profile.owned.skins.includes(item.skin);
    if (item.kind === 'title') return profile.owned.titles.includes(item.title);
    return !!profile.owned.perks[item.id];
  }
  function shopArt(item) {
    if (item.kind === 'sticker') return stickerSVG(item.sticker);
    if (item.kind === 'skin') return '';
    if (item.kind === 'title') return '称号';
    return '特典';
  }

  function viewShop() {
    setTheme(null);
    const bal = balance();
    app.innerHTML = `${subNav('shop')}
      <div class="fade-in" data-page="shop">
        <section class="r-sec">
          <div class="inner narrow">
            <p class="balance">${bal}<small>pt</small></p>
          </div>
        </section>
        <section class="r-sec alt">
          <div class="inner narrow">
            <ul class="shop">
              ${(GAME.shop || []).map(item => {
                const own = shopOwned(item);
                const code = profile.owned.perks[item.id];
                return `<li class="shop-item">
                  <div class="si-art${item.kind === 'skin' ? ' skin-' + esc(item.skin) : ''}">${shopArt(item)}</div>
                  <div class="si-body">
                    <b>${esc(item.name)}</b>
                    ${item.desc ? `<small>${esc(item.desc)}</small>` : ''}
                    <span class="si-cost">${item.cost}pt</span>
                    ${code ? `<br><span class="si-code">${esc(code)}</span>` : ''}
                  </div>
                  <button type="button" class="btn small no-arrow" data-buy="${esc(item.id)}"${own || bal < item.cost ? ' disabled' : ''}>${own ? '交換済み' : '交換する'}</button>
                </li>`;
              }).join('')}
            </ul>
          </div>
        </section>
      </div>`;
    app.querySelectorAll('[data-buy]').forEach(btn => btn.addEventListener('click', () => {
      const item = (GAME.shop || []).find(x => x.id === btn.dataset.buy);
      if (!item || shopOwned(item) || balance() < item.cost) return;
      profile.spent.push({ k: 'shop', g: '', pts: item.cost, label: '交換：' + item.name, ts: Date.now() });
      if (item.kind === 'sticker') profile.owned.stickers.push(item.sticker);
      else if (item.kind === 'skin') { profile.owned.skins.push(item.skin); profile.equip.skin = item.skin; }
      else if (item.kind === 'title') { profile.owned.titles.push(item.title); profile.equip.title = item.title; }
      else profile.owned.perks[item.id] = 'DEMO-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      saveProfile();
      updateHeader();
      toast(item.name + 'と交換しました');
      viewShop();
    }));
  }


  // ---------- router ----------
  function route() {
    const h = location.hash.replace(/^#/, '') || '/';
    const parts = h.split('/').filter(Boolean);
    if (parts[0] === 'quiz') viewQuiz();
    else if (parts[0] === 'result') viewResult();
    else if (parts[0] === 'types' && parts[1]) viewTypeDetail(decodeURIComponent(parts[1]).toUpperCase());
    else if (parts[0] === 'types') viewTypes();
    else if (parts[0] === 'me') viewMe();
    else if (parts[0] === 'missions') viewMissions();
    else if (parts[0] === 'genres') viewGenres();
    else if (parts[0] === 'shop') viewShop();
    else viewTop();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  updateHeader();
  route();
})();
</script>
</body>
</html>
